<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Meowgnal Chart Host</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #131722;
        }

        #chart {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #ctxMenu {
            position: fixed;
            display: none;
            z-index: 10;
            border: 1px solid #2A2E39;
            border-radius: 6px;
            padding: 4px;
            min-width: 220px;
            font-family: Trebuchet MS, sans-serif;
            font-size: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.45);
        }

        .ctx-item {
            padding: 7px 10px;
            border-radius: 4px;
            cursor: pointer;
            color: #D1D4DC;
        }

            .ctx-item:hover {
                background: #363A45;
            }

        .ctx-sep {
            height: 1px;
            background: #2A2E39;
            margin: 4px;
        }
    </style>
    <script src="lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div id="chart"></div>
    <div id="ctxMenu"></div>
    <script>
        const COLORS = {
            background: '#131722',
            grid: '#1E222D',
            border: '#2A2E39',
            textMuted: '#787B86',
            crosshair: '#758696',
            up: '#089981',
            down: '#F23645',
            accent: '#2962FF',
            volumeUp: 'rgba(8, 153, 129, 0.35)',
            volumeDown: 'rgba(242, 54, 69, 0.35)'
        };

        const chart = LightweightCharts.createChart(document.getElementById('chart'), {
            layout: {
                background: { type: LightweightCharts.ColorType.Solid, color: COLORS.background },
                textColor: COLORS.textMuted,
                fontSize: 11,
                fontFamily: "-apple-system, BlinkMacSystemFont, 'Trebuchet MS', Roboto, Ubuntu, Helvetica, Arial, sans-serif"
            },
            grid: {
                vertLines: { color: COLORS.grid },
                horzLines: { color: COLORS.grid }
            },
            rightPriceScale: { borderColor: COLORS.border },
            timeScale: { borderColor: COLORS.border, timeVisible: true, secondsVisible: false },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
                vertLine: { color: COLORS.crosshair, labelBackgroundColor: COLORS.border },
                horzLine: { color: COLORS.crosshair, labelBackgroundColor: COLORS.border }
            }
        });

        const volumeSeries = chart.addHistogramSeries({
            priceFormat: { type: 'volume' },
            priceScaleId: ''
        });
        chart.priceScale('').applyOptions({
            scaleMargins: { top: 0.8, bottom: 0 }
        });

        let rawData = [];
        let displayData = [];
        let chartType = 'candles';
        let activeSeries = null;

        // Paper-trading position overlay
        let lastPositions = [];
        let positionLines = [];
        let markersApi = null;

        // Drawing tools state
        let drawingMode = null;
        let cursorMode = 'cross';
        let pendingPoints = [];
        let customDrawings = [];

        // Transparent overlay canvas for drawings
        const drawCanvas = document.createElement('canvas');
        drawCanvas.style.position = 'absolute';
        drawCanvas.style.top = '0';
        drawCanvas.style.left = '0';
        drawCanvas.style.pointerEvents = 'none';
        drawCanvas.style.zIndex = '3';
        document.getElementById('chart').appendChild(drawCanvas);
        const ctx = drawCanvas.getContext('2d');

        function resizeCanvas() {
            const chartEl = document.getElementById('chart');
            drawCanvas.width = chartEl.clientWidth;
            drawCanvas.height = chartEl.clientHeight;
            renderCustomDrawings();
        }

        function resizeChart() {
            chart.applyOptions({
                width: document.body.clientWidth,
                height: document.body.clientHeight
            });
            resizeCanvas();
        }
        window.addEventListener('resize', resizeChart);
        resizeChart();

        function post(m) {
            if (window.chrome && window.chrome.webview)
                window.chrome.webview.postMessage(JSON.stringify(m));
        }

        function createSeriesForType() {
            switch (chartType) {
                case 'line':
                    return chart.addLineSeries({ color: COLORS.accent, lineWidth: 2 });
                case 'area':
                    return chart.addAreaSeries({
                        lineColor: COLORS.accent,
                        topColor: 'rgba(41, 98, 255, 0.35)',
                        bottomColor: 'rgba(41, 98, 255, 0.03)',
                        lineWidth: 2
                    });
                case 'bars':
                    return chart.addBarSeries({ upColor: COLORS.up, downColor: COLORS.down });
                default:
                    return chart.addCandlestickSeries({
                        upColor: COLORS.up,
                        downColor: COLORS.down,
                        borderUpColor: COLORS.up,
                        borderDownColor: COLORS.down,
                        wickUpColor: COLORS.up,
                        wickDownColor: COLORS.down,
                        priceFormat: { type: 'price', precision: 2, minMove: 0.01 }
                    });
            }
        }

        function heikinAshi(candles) {
            const ha = [];
            let prevOpen = null, prevClose = null;
            for (const c of candles) {
                const haClose = (c.open + c.high + c.low + c.close) / 4;
                const haOpen = prevOpen === null ? (c.open + c.close) / 2 : (prevOpen + prevClose) / 2;
                ha.push({
                    time: c.time, open: haOpen,
                    high: Math.max(c.high, haOpen, haClose),
                    low: Math.min(c.low, haOpen, haClose),
                    close: haClose
                });
                prevOpen = haOpen;
                prevClose = haClose;
            }
            return ha;
        }

        function buildDisplayData() {
            if (chartType === 'heikinashi') return heikinAshi(rawData);
            if (chartType === 'line' || chartType === 'area')
                return rawData.map(function (c) { return { time: c.time, value: c.close }; });
            return rawData;
        }

        function renderVolume() {
            volumeSeries.setData(rawData.map(function (c) {
                return {
                    time: c.time,
                    value: c.volume,
                    color: c.close >= c.open ? COLORS.volumeUp : COLORS.volumeDown
                };
            }));
        }

        function snapToBarTime(t) {
            if (!rawData.length) return t;
            let lo = 0, hi = rawData.length - 1, ans = rawData[0].time;
            while (lo <= hi) {
                const mid = (lo + hi) >> 1;
                if (rawData[mid].time <= t) { ans = rawData[mid].time; lo = mid + 1; }
                else hi = mid - 1;
            }
            return ans;
        }

        function applyPositions() {
            if (activeSeries !== null) {
                for (const line of positionLines) {
                    try { activeSeries.removePriceLine(line); } catch (e) { }
                }
            }
            positionLines = [];

            if (markersApi !== null) {
                try { markersApi.detach(); } catch (e) { }
                markersApi = null;
            }

            if (activeSeries === null || !lastPositions || lastPositions.length === 0) return;

            const markers = [];
            for (const p of lastPositions) {
                const isLong = p.side === 'long';
                const label = (isLong ? 'LONG ' : 'SHORT ') + p.leverage + 'x';

                positionLines.push(activeSeries.createPriceLine({
                    price: p.entryPrice, color: COLORS.accent, lineWidth: 1,
                    lineStyle: LightweightCharts.LineStyle.Solid,
                    axisLabelVisible: true, title: label
                }));

                if (p.stopLoss > 0) {
                    positionLines.push(activeSeries.createPriceLine({
                        price: p.stopLoss, color: COLORS.down, lineWidth: 1,
                        lineStyle: LightweightCharts.LineStyle.Dashed,
                        axisLabelVisible: true, title: 'SL'
                    }));
                }

                if (p.takeProfit > 0) {
                    positionLines.push(activeSeries.createPriceLine({
                        price: p.takeProfit, color: COLORS.up, lineWidth: 1,
                        lineStyle: LightweightCharts.LineStyle.Dashed,
                        axisLabelVisible: true, title: 'TP'
                    }));
                }

                if (p.liquidation > 0) {
                    positionLines.push(activeSeries.createPriceLine({
                        price: p.liquidation, color: COLORS.down, lineWidth: 1,
                        lineStyle: LightweightCharts.LineStyle.Dotted,
                        axisLabelVisible: true, title: 'LIQ'
                    }));
                }

                markers.push({
                    time: snapToBarTime(p.openTime),
                    position: isLong ? 'belowBar' : 'aboveBar',
                    color: isLong ? COLORS.up : COLORS.down,
                    shape: isLong ? 'arrowUp' : 'arrowDown',
                    text: label
                });
            }

            markers.sort((a, b) => a.time - b.time);

            try {
                if (typeof LightweightCharts.createSeriesMarkers === 'function') {
                    markersApi = LightweightCharts.createSeriesMarkers(activeSeries, markers);
                } else if (typeof activeSeries.setMarkers === 'function') {
                    activeSeries.setMarkers(markers);
                }
            } catch (e) { }
        }

        // ---------- drawing geometry helpers ----------
        function px(t) { return chart.timeScale().timeToCoordinate(t); }
        function py(p) { return activeSeries ? activeSeries.priceToCoordinate(p) : null; }
        function line(a, b, c, e) { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, e); ctx.stroke(); }

        function segDist(x, y, x1, y1, x2, y2) {
            const dx = x2 - x1, dy = y2 - y1;
            const len2 = dx * dx + dy * dy;
            let t = len2 === 0 ? 0 : ((x - x1) * dx + (y - y1) * dy) / len2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(x - (x1 + t * dx), y - (y1 + t * dy));
        }

        function lineDist(x, y, x1, y1, x2, y2) {
            const dx = x2 - x1, dy = y2 - y1;
            const len = Math.hypot(dx, dy);
            if (len === 0) return Math.hypot(x - x1, y - y1);
            return Math.abs(dy * (x - x1) - dx * (y - y1)) / len;
        }

        function drawSlope(x1, y1, x2, y2, mode) {
            const W = drawCanvas.width;
            if (x2 === x1) { line(x1, 0, x1, drawCanvas.height); return; }
            const m = (y2 - y1) / (x2 - x1);
            const yAt = x => y1 + m * (x - x1);
            if (mode === 'seg') line(x1, y1, x2, y2);
            else if (mode === 'ray') { const xe = x2 >= x1 ? W : 0; line(x1, y1, xe, yAt(xe)); }
            else line(0, yAt(0), W, yAt(W));
        }

        function hitTest(d, x, y) {
            const tol = 8;
            const pts = d.points || [];
            if (!pts.length || !activeSeries) return false;
            const x1 = px(pts[0].time), y1 = py(pts[0].price);
            const has2 = pts.length >= 2;
            const x2 = has2 ? px(pts[1].time) : null, y2 = has2 ? py(pts[1].price) : null;

            if (d.kind === 'horizontalline' || d.kind === 'horizontalray' || d.kind === 'crossline') {
                if (y1 !== null && Math.abs(y - y1) <= tol) return true;
                if (d.kind !== 'crossline') return false;
            }
            if (d.kind === 'verticalline' || d.kind === 'crossline') {
                if (x1 !== null && Math.abs(x - x1) <= tol) return true;
                if (d.kind === 'verticalline') return false;
            }
            if (x1 !== null && y1 !== null && x2 !== null && y2 !== null) {
                if (d.kind === 'trendline') return segDist(x, y, x1, y1, x2, y2) <= tol;
                if (d.kind === 'fibonacci') {
                    const lo = Math.min(x1, x2) - 60, hi = Math.max(x1, x2) + 60;
                    if (x < lo || x > hi) return false;
                    const diff = pts[1].price - pts[0].price;
                    const levels = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1];
                    for (const lvl of levels) {
                        const yy = py(pts[0].price + diff * lvl);
                        if (yy !== null && Math.abs(y - yy) <= tol) return true;
                    }
                    return false;
                }
                return lineDist(x, y, x1, y1, x2, y2) <= tol;
            }
            return false;
        }

        function renderCustomDrawings() {
            if (!ctx || !activeSeries) return;
            const W = drawCanvas.width, H = drawCanvas.height;
            ctx.clearRect(0, 0, W, H);

            // pending first-click marker
            for (const p of pendingPoints) {
                const x = px(p.time), y = py(p.price);
                if (x !== null && y !== null) {
                    ctx.fillStyle = COLORS.accent;
                    ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
                }
            }

            for (const d of customDrawings) {
                const pts = d.points || [];
                if (!pts.length) continue;
                ctx.strokeStyle = d.color; ctx.fillStyle = d.color;
                ctx.lineWidth = 2; ctx.font = '11px Trebuchet MS';
                const x1 = px(pts[0].time), y1 = py(pts[0].price);
                const has2 = pts.length >= 2;
                const x2 = has2 ? px(pts[1].time) : null, y2 = has2 ? py(pts[1].price) : null;

                switch (d.kind) {
                    case 'horizontalline':
                        if (y1 !== null) { line(0, y1, W, y1); if (d.label) ctx.fillText(d.label, 8, y1 - 5); }
                        break;
                    case 'horizontalray':
                        if (x1 !== null && y1 !== null) {
                            const right = !has2 || x2 === null || x2 >= x1;
                            line(right ? x1 : 0, y1, right ? W : x1, y1);
                        }
                        break;
                    case 'verticalline':
                        if (x1 !== null) line(x1, 0, x1, H);
                        break;
                    case 'crossline':
                        if (y1 !== null) line(0, y1, W, y1);
                        if (x1 !== null) line(x1, 0, x1, H);
                        break;
                    case 'trendline':
                        if (x1 !== null && y1 !== null && x2 !== null && y2 !== null) line(x1, y1, x2, y2);
                        break;
                    case 'ray':
                    case 'extendedline':
                    case 'infoline':
                    case 'trendangle':
                        if (x1 !== null && y1 !== null && x2 !== null && y2 !== null) {
                            drawSlope(x1, y1, x2, y2,
                                d.kind === 'ray' ? 'ray' : d.kind === 'extendedline' ? 'full' : 'seg');
                            if (d.kind === 'infoline') {
                                const chg = ((pts[1].price - pts[0].price) / pts[0].price) * 100;
                                ctx.fillText((chg >= 0 ? '+' : '') + chg.toFixed(2) + '%', x2 + 6, y2 - 6);
                            }
                            if (d.kind === 'trendangle') {
                                const ang = Math.atan2(-(y2 - y1), x2 - x1) * 180 / Math.PI;
                                ctx.fillText(ang.toFixed(1) + '°', x2 + 6, y2 - 6);
                            }
                        }
                        break;
                    case 'fibonacci':
                        if (x1 !== null && y1 !== null && x2 !== null && y2 !== null) {
                            line(x1, y1, x2, y2);
                            const lo = Math.min(x1, x2) - 60, hi = Math.max(x1, x2) + 60;
                            const diff = pts[1].price - pts[0].price;
                            ctx.setLineDash([5, 5]);
                            const levels = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1];
                            for (const lvl of levels) {
                                const yy = py(pts[0].price + diff * lvl);
                                if (yy !== null) {
                                    line(lo, yy, hi, yy);
                                    ctx.fillText((lvl * 100).toFixed(1) + '%', hi + 5, yy + 4);
                                }
                            }
                            ctx.setLineDash([]);
                        }
                        break;
                }
            }
        }

        function applyTheme(c) {
            if (!c) return;
            COLORS.background = c.background; COLORS.grid = c.grid; COLORS.border = c.border;
            COLORS.textMuted = c.textMuted; COLORS.crosshair = c.crosshair; COLORS.accent = c.accent;
            COLORS.up = c.up; COLORS.down = c.down;
            COLORS.volumeUp = c.volumeUp; COLORS.volumeDown = c.volumeDown;
            document.body.style.background = c.background;
            chart.applyOptions({
                layout: { background: { type: LightweightCharts.ColorType.Solid, color: c.background }, textColor: c.textMuted },
                grid: { vertLines: { color: c.grid }, horzLines: { color: c.grid } },
                rightPriceScale: { borderColor: c.border },
                timeScale: { borderColor: c.border },
                crosshair: {
                    vertLine: { color: c.crosshair, labelBackgroundColor: c.border },
                    horzLine: { color: c.crosshair, labelBackgroundColor: c.border }
                }
            });
            renderWithCurrentType();
        }

        function renderWithCurrentType() {
            if (activeSeries !== null) {
                chart.removeSeries(activeSeries);
                activeSeries = null;
            }
            markersApi = null;
            positionLines = [];

            activeSeries = createSeriesForType();
            displayData = buildDisplayData();
            activeSeries.setData(displayData);
            renderVolume();

            const total = displayData.length;
            if (total > 0) {
                chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, total - 120), to: total + 4 });
            }

            applyPositions();
            renderCustomDrawings();
        }

        renderWithCurrentType();

        chart.timeScale().subscribeVisibleTimeRangeChange(renderCustomDrawings);

        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', function (e) {
                const msg = e.data;
                if (!msg || !msg.type) return;

                if (msg.type === 'setCandles') {
                    rawData = msg.data;
                    chart.applyOptions({ timeScale: { secondsVisible: msg.secondsVisible === true } });
                    renderWithCurrentType();
                } else if (msg.type === 'updateCandle') {
                    if (activeSeries !== null) activeSeries.update(msg.data);
                    volumeSeries.update({
                        time: msg.data.time,
                        value: msg.data.volume || 0,
                        color: msg.data.close >= msg.data.open ? COLORS.volumeUp : COLORS.volumeDown
                    });
                } else if (msg.type === 'setChartType') {
                    chartType = msg.chartType;
                    renderWithCurrentType();
                } else if (msg.type === 'setPositions') {
                    lastPositions = msg.positions || [];
                    applyPositions();
                } else if (msg.type === 'setDrawings') {
                    customDrawings = msg.drawings || [];
                    renderCustomDrawings();
                } else if (msg.type === 'setTheme') {
                    applyTheme(msg.colors);
                } else if (msg.type === 'setDrawingMode') {
                    const m = msg.mode;
                    if (m === 'cross' || m === 'dot' || m === 'arrow') {
                        cursorMode = m;
                        drawingMode = null;
                        chart.applyOptions({
                            crosshair: { mode: m === 'arrow' ? LightweightCharts.CrosshairMode.Hidden : LightweightCharts.CrosshairMode.Normal }
                        });
                        document.getElementById('chart').style.cursor = m === 'arrow' ? 'default' : 'crosshair';
                    } else if (m === 'eraser') {
                        drawingMode = 'eraser';
                        document.getElementById('chart').style.cursor = 'pointer';
                    } else {
                        drawingMode = m === 'none' ? null : m;
                        document.getElementById('chart').style.cursor = drawingMode ? 'crosshair' : 'default';
                    }
                    pendingPoints = [];
                    renderCustomDrawings();
                }
            });
        }

        // ---------- right-click context menu ----------
        const ctxMenu = document.getElementById('ctxMenu');
        let ctxPrice = null;

        function fmtPrice(p) {
            if (p >= 1000) return p.toFixed(2);
            if (p >= 1) return p.toFixed(4);
            return p.toFixed(8);
        }

        function menuItem(label, act) {
            const d = document.createElement('div');
            d.className = 'ctx-item';
            d.textContent = label;
            d.onmousedown = function (e) { e.stopPropagation(); };
            d.onclick = function () { ctxMenu.style.display = 'none'; act(); };
            return d;
        }

        function menuSep() {
            const d = document.createElement('div');
            d.className = 'ctx-sep';
            return d;
        }

        function openCtxMenu(x, y, price) {
            ctxPrice = price;
            ctxMenu.innerHTML = '';
            ctxMenu.style.background = COLORS.background;
            ctxMenu.style.borderColor = COLORS.border;

            ctxMenu.appendChild(menuItem('Reset chart view', function () {
                const total = displayData.length;
                if (total > 0) chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, total - 120), to: total + 4 });
            }));
            if (price != null) {
                ctxMenu.appendChild(menuItem('Copy price ' + fmtPrice(price), function () {
                    post({ type: 'copyPrice', price: price });
                }));
                ctxMenu.appendChild(menuItem('Add alert at ' + fmtPrice(price), function () {
                    post({ type: 'addAlert', price: price });
                }));
            }
            ctxMenu.appendChild(menuSep());
            ctxMenu.appendChild(menuItem('Chart settings…', function () {
                post({ type: 'openChartSettings' });
            }));

            ctxMenu.style.display = 'block';
            const mw = ctxMenu.offsetWidth, mh = ctxMenu.offsetHeight;
            ctxMenu.style.left = Math.min(x, window.innerWidth - mw - 8) + 'px';
            ctxMenu.style.top = Math.min(y, window.innerHeight - mh - 8) + 'px';
        }

        document.getElementById('chart').addEventListener('contextmenu', function (e) {
            e.preventDefault();
            const rect = e.currentTarget.getBoundingClientRect();
            let price = null;
            if (activeSeries) {
                const p = activeSeries.coordinateToPrice(e.clientY - rect.top);
                if (p !== null && p !== undefined && !isNaN(p)) price = p;
            }
            openCtxMenu(e.clientX, e.clientY, price);
        });

        document.addEventListener('mousedown', function (e) {
            if (!ctxMenu.contains(e.target)) ctxMenu.style.display = 'none';
        });

        // ---------- drawing clicks + eraser ----------
        const ONE_CLICK = { horizontal: 1, verticalline: 1, crossline: 1 };

        chart.subscribeClick(function (param) {
            if (!param.point) return;
            const x = param.point.x, y = param.point.y;

            if (drawingMode === 'eraser') {
                for (let i = customDrawings.length - 1; i >= 0; i--) {
                    if (hitTest(customDrawings[i], x, y)) {
                        post({ type: 'deleteDrawing', id: customDrawings[i].id });
                        return;
                    }
                }
                return;
            }

            if (!drawingMode || !param.time) return;
            const price = activeSeries.coordinateToPrice(y);
            if (price === null || price === undefined) return;

            pendingPoints.push({ time: param.time, price: price });

            const need = ONE_CLICK[drawingMode] === 1 ? 1 : 2;
            if (pendingPoints.length >= need) {
                const drawing = {
                    id: Date.now().toString(36) + Math.random().toString(36).substr(2),
                    kind: drawingMode,
                    color: '#2962FF',
                    label: '',
                    alert: false,
                    points: pendingPoints.slice(0, need).map(function (p) { return { time: p.time, price: p.price }; })
                };
                post({ type: 'drawingCompleted', drawing: drawing });
                pendingPoints = [];
                renderCustomDrawings();
            } else {
                renderCustomDrawings();
            }
        });

        chart.subscribeCrosshairMove(function (param) {
            if (!window.chrome || !window.chrome.webview) return;

            if (!param || !param.time) {
                window.chrome.webview.postMessage(JSON.stringify({ type: 'crosshair', hasData: false }));
                return;
            }

            let hovered = displayData.find(function (d) { return d.time === param.time; });
            if (!hovered || hovered.open === undefined) {
                hovered = rawData.find(function (d) { return d.time === param.time; });
            }
            if (!hovered || hovered.open === undefined) {
                window.chrome.webview.postMessage(JSON.stringify({ type: 'crosshair', hasData: false }));
                return;
            }

            const ohlcList = (displayData.length > 0 && displayData[0].open !== undefined) ? displayData : rawData;
            const idx = ohlcList.findIndex(function (d) { return d.time === hovered.time; });
            const prev = idx > 0 ? ohlcList[idx - 1] : hovered;

            window.chrome.webview.postMessage(JSON.stringify({
                type: 'crosshair',
                hasData: true,
                open: hovered.open, high: hovered.high, low: hovered.low, close: hovered.close,
                prevOpen: prev.open, prevHigh: prev.high, prevLow: prev.low, prevClose: prev.close
            }));
        });
    </script>
</body>
</html>
