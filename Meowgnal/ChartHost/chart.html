<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Meowgnal Chart Host</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #131722;
        }

        #chart {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #ctxMenu {
            position: fixed;
            display: none;
            z-index: 10;
            border: 1px solid #2A2E39;
            border-radius: 6px;
            padding: 4px;
            min-width: 220px;
            font-family: Trebuchet MS, sans-serif;
            font-size: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.45);
        }

        .ctx-item {
            padding: 7px 10px;
            border-radius: 4px;
            cursor: pointer;
            color: #D1D4DC;
        }

            .ctx-item:hover {
                background: #363A45;
            }

        .ctx-sep {
            height: 1px;
            background: #2A2E39;
            margin: 4px;
        }

        #textInput {
            position: fixed;
            display: none;
            z-index: 20;
            background: #1E222D;
            color: #D1D4DC;
            border: 1px solid #2962FF;
            border-radius: 4px;
            padding: 4px 8px;
            width: 160px;
            font-family: Trebuchet MS, sans-serif;
            font-size: 12px;
            outline: none;
        }
    </style>
    <script src="lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div id="chart"></div>
    <div id="ctxMenu"></div>
    <input id="textInput" />
    <script>
        const COLORS = {
            background: '#131722', grid: '#1E222D', border: '#2A2E39',
            textMuted: '#787B86', crosshair: '#758696', accent: '#2962FF',
            up: '#089981', down: '#F23645',
            volumeUp: 'rgba(8, 153, 129, 0.35)', volumeDown: 'rgba(242, 54, 69, 0.35)'
        };
        const FIB_LEVELS = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1];

        const chart = LightweightCharts.createChart(document.getElementById('chart'), {
            layout: {
                background: { type: LightweightCharts.ColorType.Solid, color: COLORS.background },
                textColor: COLORS.textMuted, fontSize: 11,
                fontFamily: "-apple-system, BlinkMacSystemFont, 'Trebuchet MS', Roboto, Ubuntu, Helvetica, Arial, sans-serif"
            },
            grid: { vertLines: { color: COLORS.grid }, horzLines: { color: COLORS.grid } },
            rightPriceScale: { borderColor: COLORS.border },
            timeScale: { borderColor: COLORS.border, timeVisible: true, secondsVisible: false },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
                vertLine: { color: COLORS.crosshair, labelBackgroundColor: COLORS.border },
                horzLine: { color: COLORS.crosshair, labelBackgroundColor: COLORS.border }
            }
        });

        const volumeSeries = chart.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: '' });
        chart.priceScale('').applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });

        let rawData = [];
        let displayData = [];
        let chartType = 'candles';
        let activeSeries = null;

        let lastPositions = [];
        let positionLines = [];
        let markersApi = null;

        let drawingMode = null;
        let cursorMode = 'cross';
        let pendingPoints = [];
        let customDrawings = [];
        let defaultColor = '#2962FF';

        let selectedDrawingIds = new Set();
        let isCtrlPressed = false;

        let dragState = null;
        let isDragging = false;
        const HANDLE_SIZE = 10;
        let clipboardDrawing = null;

        const drawCanvas = document.createElement('canvas');
        drawCanvas.style.position = 'absolute';
        drawCanvas.style.top = '0';
        drawCanvas.style.left = '0';
        drawCanvas.style.pointerEvents = 'none';
        drawCanvas.style.zIndex = '3';
        document.getElementById('chart').appendChild(drawCanvas);
        const ctx = drawCanvas.getContext('2d');

        function resizeCanvas() {
            const el = document.getElementById('chart');
            drawCanvas.width = el.clientWidth;
            drawCanvas.height = el.clientHeight;
            renderCustomDrawings();
        }
        function resizeChart() {
            chart.applyOptions({ width: document.body.clientWidth, height: document.body.clientHeight });
            resizeCanvas();
        }
        window.addEventListener('resize', resizeChart);

        window.addEventListener('keydown', function (e) {
            if (e.key === 'Control') isCtrlPressed = true;
            if (e.key === 'g' && isCtrlPressed && !e.shiftKey && selectedDrawingIds.size >= 2) {
                const groupId = Date.now().toString(36);
                post({ type: 'groupDrawings', ids: Array.from(selectedDrawingIds), groupId: groupId });
            }
            if (e.key === 'G' && isCtrlPressed && e.shiftKey && selectedDrawingIds.size > 0) {
                post({ type: 'ungroupDrawings', ids: Array.from(selectedDrawingIds) });
            }
        });

        window.addEventListener('keyup', function (e) {
            if (e.key === 'Control') isCtrlPressed = false;

            if (e.key === 'Delete' && selectedDrawingIds.size > 0) {
                post({ type: 'deleteDrawings', ids: Array.from(selectedDrawingIds) });
                selectedDrawingIds.clear();
                renderCustomDrawings();
                return;
            }
            if (e.key === 'Escape') {
                if (pendingPoints.length > 0) {
                    pendingPoints = [];
                    renderCustomDrawings();
                    return;
                }
                if (selectedDrawingIds.size > 0) {
                    selectedDrawingIds.clear();
                    renderCustomDrawings();
                }
            }
        });

        resizeChart();

        function post(m) {
            if (window.chrome && window.chrome.webview)
                window.chrome.webview.postMessage(JSON.stringify(m));
        }

        function copySelectedDrawing() {
            if (selectedDrawingIds.size > 0) {
                const firstId = Array.from(selectedDrawingIds)[0];
                const src = customDrawings.find(d => d.id === firstId);
                if (src) {
                    clipboardDrawing = JSON.parse(JSON.stringify(src));
                    post({ type: 'copyToast' });
                }
            }
        }

        function pasteCopiedDrawing() {
            if (clipboardDrawing) {
                const copy = JSON.parse(JSON.stringify(clipboardDrawing));
                copy.id = Date.now().toString(36) + Math.random().toString(36).substr(2);
                const dt = rawData.length > 1 ? (rawData[1].time - rawData[0].time) : 3600;
                for (const p of copy.points || []) {
                    p.time = p.time + dt;
                    p.price = p.price * 1.002;
                }
                post({ type: 'pasteDrawing', drawing: copy });
            }
        }

        function fmtPrice(p) {
            if (p >= 1000) return p.toFixed(2);
            if (p >= 1) return p.toFixed(4);
            return p.toFixed(8);
        }

        function createSeriesForType() {
            switch (chartType) {
                case 'line': return chart.addLineSeries({ color: COLORS.accent, lineWidth: 2 });
                case 'area': return chart.addAreaSeries({ lineColor: COLORS.accent, topColor: 'rgba(41, 98, 255, 0.35)', bottomColor: 'rgba(41, 98, 255, 0.03)', lineWidth: 2 });
                case 'bars': return chart.addBarSeries({ upColor: COLORS.up, downColor: COLORS.down });
                default: return chart.addCandlestickSeries({
                    upColor: COLORS.up, downColor: COLORS.down,
                    borderUpColor: COLORS.up, borderDownColor: COLORS.down,
                    wickUpColor: COLORS.up, wickDownColor: COLORS.down,
                    priceFormat: { type: 'price', precision: 2, minMove: 0.01 }
                });
            }
        }

        function heikinAshi(candles) {
            const ha = []; let po = null, pc = null;
            for (const c of candles) {
                const hc = (c.open + c.high + c.low + c.close) / 4;
                const ho = po === null ? (c.open + c.close) / 2 : (po + pc) / 2;
                ha.push({ time: c.time, open: ho, high: Math.max(c.high, ho, hc), low: Math.min(c.low, ho, hc), close: hc });
                po = ho; pc = hc;
            }
            return ha;
        }

        function buildDisplayData() {
            if (chartType === 'heikinashi') return heikinAshi(rawData);
            if (chartType === 'line' || chartType === 'area')
                return rawData.map(c => ({ time: c.time, value: c.close }));
            return rawData;
        }

        function renderVolume() {
            volumeSeries.setData(rawData.map(c => ({
                time: c.time, value: c.volume,
                color: c.close >= c.open ? COLORS.volumeUp : COLORS.volumeDown
            })));
        }

        function snapToBarTime(t) {
            if (!rawData.length) return t;
            let lo = 0, hi = rawData.length - 1, ans = rawData[0].time;
            while (lo <= hi) { const mid = (lo + hi) >> 1; if (rawData[mid].time <= t) { ans = rawData[mid].time; lo = mid + 1; } else hi = mid - 1; }
            return ans;
        }

        function applyPositions() {
            if (activeSeries !== null) for (const l of positionLines) { try { activeSeries.removePriceLine(l); } catch (e) { } }
            positionLines = [];
            if (markersApi !== null) { try { markersApi.detach(); } catch (e) { } markersApi = null; }
            if (activeSeries === null || !lastPositions || !lastPositions.length) return;

            const markers = [];
            for (const p of lastPositions) {
                const isLong = p.side === 'long';
                const label = (isLong ? 'LONG ' : 'SHORT ') + p.leverage + 'x';
                positionLines.push(activeSeries.createPriceLine({ price: p.entryPrice, color: COLORS.accent, lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Solid, axisLabelVisible: true, title: label }));
                if (p.stopLoss > 0) positionLines.push(activeSeries.createPriceLine({ price: p.stopLoss, color: COLORS.down, lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: 'SL' }));
                if (p.takeProfit > 0) positionLines.push(activeSeries.createPriceLine({ price: p.takeProfit, color: COLORS.up, lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: 'TP' }));
                if (p.liquidation > 0) positionLines.push(activeSeries.createPriceLine({ price: p.liquidation, color: COLORS.down, lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dotted, axisLabelVisible: true, title: 'LIQ' }));
                markers.push({ time: snapToBarTime(p.openTime), position: isLong ? 'belowBar' : 'aboveBar', color: isLong ? COLORS.up : COLORS.down, shape: isLong ? 'arrowUp' : 'arrowDown', text: label });
            }
            markers.sort((a, b) => a.time - b.time);
            try {
                if (typeof LightweightCharts.createSeriesMarkers === 'function') markersApi = LightweightCharts.createSeriesMarkers(activeSeries, markers);
                else if (typeof activeSeries.setMarkers === 'function') activeSeries.setMarkers(markers);
            } catch (e) { }
        }

        function px(t) { return chart.timeScale().timeToCoordinate(t); }
        function py(p) { return activeSeries ? activeSeries.priceToCoordinate(p) : null; }

        function slopeCoords(x1, y1, x2, y2, mode) {
            const W = drawCanvas.width, H = drawCanvas.height;
            if (x2 === x1) return mode === 'seg' ? [x1, y1, x2, y2] : [x1, 0, x1, H];
            const m = (y2 - y1) / (x2 - x1);
            const yAt = x => y1 + m * (x - x1);
            if (mode === 'seg') return [x1, y1, x2, y2];
            if (mode === 'ray') { const xe = x2 >= x1 ? W : 0; return [x1, y1, xe, yAt(xe)]; }
            return [0, yAt(0), W, yAt(W)];
        }

        function segDist(x, y, x1, y1, x2, y2) {
            const dx = x2 - x1, dy = y2 - y1;
            const len2 = dx * dx + dy * dy;
            let t = len2 === 0 ? 0 : ((x - x1) * dx + (y - y1) * dy) / len2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(x - (x1 + t * dx), y - (y1 + t * dy));
        }

        function regressionSeg(t1, t2) {
            const lo = Math.min(t1, t2), hi = Math.max(t1, t2);
            const idx = rawData.filter(c => c.time >= lo && c.time <= hi);
            if (idx.length < 2) return null;
            let sx = 0, sy = 0, sxy = 0, sxx = 0;
            idx.forEach((c, i) => { sx += i; sy += c.close; sxy += i * c.close; sxx += i * i; });
            const nn = idx.length;
            const b = (nn * sxy - sx * sy) / ((nn * sxx - sx * sx) || 1);
            const a = (sy - b * sx) / nn;
            const xa = px(idx[0].time), xb = px(idx[nn - 1].time);
            const ya = py(a), yb = py(a + b * (nn - 1));
            if (xa === null || xb === null || ya === null || yb === null) return null;
            return [xa, ya, xb, yb];
        }

        function geometry(d) {
            const W = drawCanvas.width, H = drawCanvas.height;
            const g = { lines: [], dashed: [], circles: [], arcs: [], labels: [], glyphs: [], anchors: [], boxes: [], texts: [] };
            const pts = d.points || [];
            if (!pts.length || !activeSeries) return g;
            const X = i => px(pts[i].time), Y = i => py(pts[i].price);
            const n = pts.length;
            const x1 = X(0), y1 = Y(0);
            const x2 = n > 1 ? X(1) : null, y2 = n > 1 ? Y(1) : null;
            const x3 = n > 2 ? X(2) : null, y3 = n > 2 ? Y(2) : null;
            const x4 = n > 3 ? X(3) : null, y4 = n > 3 ? Y(3) : null;
            const m = (x1 !== null && x2 !== null && x2 !== x1) ? (y2 - y1) / (x2 - x1) : null;

            switch (d.kind) {
                case 'horizontalline':
                    g.lines.push([0, y1, W, y1]);
                    if (d.label) g.labels.push([d.label, 8, y1 - 5]);
                    break;
                case 'horizontalray': {
                    const right = x2 === null || x2 >= x1;
                    g.lines.push([right ? x1 : 0, y1, right ? W : x1, y1]);
                    break;
                }
                case 'verticalline': g.lines.push([x1, 0, x1, H]); break;
                case 'crossline': g.lines.push([0, y1, W, y1], [x1, 0, x1, H]); break;
                case 'trendline': g.lines.push([x1, y1, x2, y2]); break;
                case 'ray': g.lines.push(slopeCoords(x1, y1, x2, y2, 'ray')); break;
                case 'extendedline': g.lines.push(slopeCoords(x1, y1, x2, y2, 'full')); break;
                case 'infoline': {
                    g.lines.push([x1, y1, x2, y2]);
                    const chg = ((pts[1].price - pts[0].price) / pts[0].price) * 100;
                    g.labels.push([(chg >= 0 ? '+' : '') + chg.toFixed(2) + '%', x2 + 6, y2 - 6]);
                    break;
                }
                case 'trendangle': {
                    g.lines.push([x1, y1, x2, y2]);
                    const ang = Math.atan2(-(y2 - y1), x2 - x1) * 180 / Math.PI;
                    g.labels.push([ang.toFixed(1) + '°', x2 + 6, y2 - 6]);
                    break;
                }
                case 'fibonacci': {
                    g.lines.push([x1, y1, x2, y2]);
                    const lo = Math.min(x1, x2) - 60, hi = Math.max(x1, x2) + 60;
                    const diff = pts[1].price - pts[0].price;
                    for (const lvl of FIB_LEVELS) {
                        const yy = py(pts[0].price + diff * lvl);
                        if (yy !== null) { g.dashed.push([lo, yy, hi, yy]); g.labels.push([(lvl * 100).toFixed(1) + '%', hi + 5, yy + 4]); }
                    }
                    break;
                }
                case 'parallelchannel': {
                    if (m === null || x3 === null) break;
                    g.lines.push(slopeCoords(x1, y1, x2, y2, 'full'));
                    const yAt = x => y3 + m * (x - x3);
                    g.lines.push([0, yAt(0), W, yAt(W)]);
                    break;
                }
                case 'flattopbottom':
                    g.lines.push([0, y1, W, y1], [0, y3, W, y3]);
                    break;
                case 'disjointchannel':
                    g.lines.push([x1, y1, x2, y2], [x3, y3, x4, y4]);
                    break;
                case 'regressiontrend': {
                    const r = regressionSeg(pts[0].time, pts[1].time);
                    if (r) g.lines.push(r);
                    break;
                }
                case 'pitchfork':
                case 'schiffpitchfork':
                case 'modifiedschiffpitchfork':
                case 'insidepitchfork': {
                    if (x3 === null) break;
                    let ax = x1, ay = y1;
                    if (d.kind === 'schiffpitchfork') { ax = (x1 + x2) / 2; ay = (y1 + y2) / 2; }
                    else if (d.kind === 'modifiedschiffpitchfork') { ax = (x1 + (x1 + x2) / 2) / 2; ay = (y1 + (y1 + y2) / 2) / 2; }
                    else if (d.kind === 'insidepitchfork') { ax = (x2 + x3) / 2; ay = (y2 + y3) / 2; }
                    const mx = (x2 + x3) / 2, my = (y2 + y3) / 2;
                    if (mx === ax) break;
                    const mm = (my - ay) / (mx - ax);
                    const yM = x => ay + mm * (x - ax);
                    const y2At = x => y2 + mm * (x - x2);
                    const y3At = x => y3 + mm * (x - x3);
                    g.lines.push([0, yM(0), W, yM(W)], [0, y2At(0), W, y2At(W)], [0, y3At(0), W, y3At(W)]);
                    break;
                }
                case 'fibextension': {
                    const lo = Math.min(x1, x2);
                    const diff = pts[1].price - pts[0].price;
                    g.lines.push([x1, y1, x2, y2]);
                    for (const lvl of FIB_LEVELS) {
                        const yy = py(pts[0].price + diff * lvl);
                        if (yy !== null) { g.dashed.push([lo, yy, W, yy]); g.labels.push([(lvl * 100).toFixed(1) + '%', W - 46, yy - 4]); }
                    }
                    break;
                }
                case 'fibtimezone': {
                    const dx = x2 - x1;
                    for (const r of [0.236, 0.382, 0.5, 0.618, 0.786, 1, 1.618, 2.618]) {
                        const xx = x1 + dx * r;
                        if (xx >= 0 && xx <= W) g.dashed.push([xx, 0, xx, H]);
                    }
                    break;
                }
                case 'fibcircles': {
                    const dist = Math.hypot(x2 - x1, y2 - y1);
                    for (const lvl of FIB_LEVELS) if (lvl > 0) g.circles.push([x2, y2, dist * lvl]);
                    break;
                }
                case 'fibspiral': {
                    const dist = Math.hypot(x2 - x1, y2 - y1);
                    const startAng = Math.atan2(y1 - y2, x1 - x2);
                    for (const lvl of FIB_LEVELS) if (lvl > 0) g.arcs.push([x2, y2, dist * lvl, startAng, startAng + Math.PI]);
                    break;
                }
                case 'fibarcs': {
                    const dist = Math.hypot(x2 - x1, y2 - y1);
                    const ang = Math.atan2(y2 - y1, x2 - x1);
                    for (const lvl of FIB_LEVELS) if (lvl > 0) g.arcs.push([x1, y1, dist * lvl, ang - 0.6, ang + 0.6]);
                    break;
                }
                case 'fibwedge': {
                    g.lines.push(slopeCoords(x1, y1, x2, y2, 'ray'));
                    g.lines.push([x1, y1, W, y1]);
                    const diff = pts[1].price - pts[0].price;
                    for (const lvl of FIB_LEVELS) {
                        const yy = py(pts[0].price + diff * lvl);
                        if (yy !== null) g.dashed.push([Math.min(x1, x2), yy, Math.max(x1, x2), yy]);
                    }
                    break;
                }
                case 'fibspeedfan': {
                    for (const lvl of FIB_LEVELS) {
                        const yy = y1 + (y2 - y1) * lvl;
                        g.lines.push([x1, y1, x2, yy]);
                    }
                    break;
                }
                case 'pitchfan': {
                    for (const lvl of FIB_LEVELS) {
                        const yy = y1 + (y2 - y1) * lvl;
                        g.lines.push(slopeCoords(x1, y1, x2, yy, 'ray'));
                    }
                    break;
                }
                case 'gannbox': {
                    g.lines.push([x1, y1, x2, y1], [x1, y2, x2, y2], [x1, y1, x1, y2], [x2, y1, x2, y2]);
                    for (const r of [0.25, 0.5, 0.75]) {
                        const xx = x1 + (x2 - x1) * r;
                        const yy = y1 + (y2 - y1) * r;
                        g.dashed.push([xx, y1, xx, y2], [x1, yy, x2, yy]);
                    }
                    break;
                }
                case 'gannsquare': {
                    const side = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1));
                    const sx = x2 >= x1 ? 1 : -1, sy = y2 >= y1 ? 1 : -1;
                    const xe = x1 + side * sx, ye = y1 + side * sy;
                    g.lines.push([x1, y1, xe, y1], [x1, ye, xe, ye], [x1, y1, x1, ye], [xe, y1, xe, ye]);
                    for (const r of [0.25, 0.5, 0.75]) {
                        g.dashed.push([x1 + side * r * sx, y1, x1 + side * r * sx, ye], [x1, y1 + side * r * sy, xe, y1 + side * r * sy]);
                    }
                    break;
                }
                case 'gannfan': {
                    if (m === null) break;
                    for (const r of [0.25, 0.5, 1, 2, 4]) {
                        const yAt = x => y1 + m * r * (x - x1);
                        g.lines.push([x1, y1, W, yAt(W)]);
                    }
                    break;
                }
                case 'rectangle': {
                    const xL = Math.min(x1, x2), xR = Math.max(x1, x2);
                    const yT = Math.min(y1, y2), yB = Math.max(y1, y2);
                    g.lines.push([xL, yT, xR, yT], [xR, yT, xR, yB], [xR, yB, xL, yB], [xL, yB, xL, yT]);
                    break;
                }
                case 'rotatedrectangle': {
                    if (x3 === null || m === null) break;
                    const pm = -1 / m;
                    const dist = Math.abs((pm * (x3 - x2) - (y3 - y2)) / Math.hypot(pm, 1));
                    const ux = (x2 - x1) / Math.hypot(x2 - x1, y2 - y1);
                    const uy = (y2 - y1) / Math.hypot(x2 - x1, y2 - y1);
                    const pxr = -uy, pyr = ux;
                    const x2p = x2 + pxr * dist, y2p = y2 + pyr * dist;
                    const x1p = x1 + pxr * dist, y1p = y1 + pyr * dist;
                    g.lines.push([x1, y1, x2, y2], [x2, y2, x2p, y2p], [x2p, y2p, x1p, y1p], [x1p, y1p, x1, y1]);
                    break;
                }
                case 'circle': {
                    const r = Math.hypot(x2 - x1, y2 - y1);
                    g.circles.push([x1, y1, r]);
                    break;
                }
                case 'ellipse': {
                    const rx = Math.abs(x2 - x1);
                    const ry = Math.abs(y2 - y1);
                    const segs = 48;
                    const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
                    let pxp = cx + rx, pyp = cy;
                    for (let i = 1; i <= segs; i++) {
                        const a = (i / segs) * Math.PI * 2;
                        const nx = cx + rx * Math.cos(a);
                        const ny = cy + ry * Math.sin(a);
                        g.lines.push([pxp, pyp, nx, ny]);
                        pxp = nx; pyp = ny;
                    }
                    break;
                }
                case 'triangle': {
                    if (x3 === null) break;
                    g.lines.push([x1, y1, x2, y2], [x2, y2, x3, y3], [x3, y3, x1, y1]);
                    break;
                }
                case 'polyline': {
                    for (let i = 0; i < pts.length - 1; i++) {
                        const xa = px(pts[i].time), ya = py(pts[i].price);
                        const xb = px(pts[i + 1].time), yb = py(pts[i + 1].price);
                        if (xa !== null && ya !== null && xb !== null && yb !== null)
                            g.lines.push([xa, ya, xb, yb]);
                    }
                    break;
                }
                case 'arc': {
                    if (x3 === null) break;
                    const ang1 = Math.atan2(y2 - y1, x2 - x1);
                    const ang2 = Math.atan2(y3 - y1, x3 - x1);
                    const r = Math.hypot(x2 - x1, y2 - y1);
                    let a1 = ang1, a2 = ang2;
                    if (a2 < a1) a2 += Math.PI * 2;
                    g.arcs.push([x1, y1, r, a1, a2]);
                    break;
                }
                case 'arrow': {
                    g.lines.push([x1, y1, x2, y2]);
                    const ang = Math.atan2(y2 - y1, x2 - x1);
                    g.glyphs.push({ t: 'arrowhead', x: x2, y: y2, a: ang, l: 10 });
                    break;
                }
                case 'arrowmarkup':
                    g.glyphs.push({ t: 'markup', x: x1, y: y1 });
                    g.anchors.push([x1, y1, 14]);
                    break;
                case 'arrowmarkdown':
                    g.glyphs.push({ t: 'markdown', x: x1, y: y1 });
                    g.anchors.push([x1, y1, 14]);
                    break;
                case 'brush':
                case 'highlighter': {
                    for (let i = 0; i < pts.length - 1; i++) {
                        const xa = px(pts[i].time), ya = py(pts[i].price);
                        const xb = px(pts[i + 1].time), yb = py(pts[i + 1].price);
                        if (xa !== null && ya !== null && xb !== null && yb !== null)
                            g.lines.push([xa, ya, xb, yb]);
                    }
                    break;
                }
                case 'text':
                    g.texts.push({ x: x1, y: y1, s: d.label || '', size: 13 });
                    g.anchors.push([x1, y1, 24]);
                    break;
                case 'note':
                    g.boxes.push({ x: x1, y: y1, s: d.label || '' });
                    g.anchors.push([x1, y1, 28]);
                    break;
                case 'pricelabel':
                    g.boxes.push({ x: W - 4, y: y1, s: fmtPrice(pts[0].price), right: true });
                    g.dashed.push([x1, y1, W, y1]);
                    g.anchors.push([W - 40, y1, 28]);
                    break;
                case 'pin':
                    g.glyphs.push({ t: 'pin', x: x1, y: y1 });
                    g.anchors.push([x1, y1, 14]);
                    break;
                case 'flag':
                    g.glyphs.push({ t: 'flag', x: x1, y: y1 });
                    g.anchors.push([x1, y1, 16]);
                    break;
                case 'sticker':
                    g.texts.push({ x: x1, y: y1, s: d.label || '🐱', size: 22 });
                    g.anchors.push([x1, y1, 16]);
                    break;
            }
            return g;
        }

        function getHandles(d) {
            const pts = d.points || [];
            if (!pts.length || !activeSeries) return [];
            const handles = [];
            if (d.kind === 'horizontalline' || d.kind === 'pricelabel') {
                const y = py(pts[0].price);
                if (y !== null) handles.push({ index: 0, x: drawCanvas.width / 2, y: y, priceOnly: true, timeOnly: false });
            } else if (d.kind === 'verticalline') {
                const x = px(pts[0].time);
                if (x !== null) handles.push({ index: 0, x: x, y: drawCanvas.height / 2, priceOnly: false, timeOnly: true });
            } else {
                for (let i = 0; i < pts.length; i++) {
                    const x = px(pts[i].time), y = py(pts[i].price);
                    if (x !== null && y !== null) handles.push({ index: i, x: x, y: y, priceOnly: false, timeOnly: false });
                }
            }
            return handles;
        }

        function hitTestHandle(d, x, y) {
            if (d.locked) return null;
            const handles = getHandles(d);
            for (const h of handles) {
                if (Math.abs(x - h.x) <= HANDLE_SIZE / 2 + 2 && Math.abs(y - h.y) <= HANDLE_SIZE / 2 + 2) {
                    return h;
                }
            }
            return null;
        }

        function hitTest(d, x, y) {
            const tol = 8;
            const g = geometry(d);
            for (const L of g.lines.concat(g.dashed))
                if (segDist(x, y, L[0], L[1], L[2], L[3]) <= tol) return true;
            for (const c of g.circles)
                if (Math.abs(Math.hypot(x - c[0], y - c[1]) - c[2]) <= tol) return true;
            for (const a of g.arcs)
                if (Math.abs(Math.hypot(x - a[0], y - a[1]) - a[2]) <= tol) return true;
            for (const a of g.anchors)
                if (Math.hypot(x - a[0], y - a[1]) <= a[2]) return true;
            return false;
        }

        function renderCustomDrawings() {
            if (!ctx || !activeSeries) return;
            ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);

            for (const p of pendingPoints) {
                const x = px(p.time), y = py(p.price);
                if (x !== null && y !== null) {
                    ctx.fillStyle = COLORS.accent;
                    ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
                }
            }

            for (const d of customDrawings) {
                const g = geometry(d);
                ctx.strokeStyle = d.color; ctx.fillStyle = d.color;
                ctx.lineWidth = d.kind === 'highlighter' ? 10 : (d.lineWidth || 2);
                const styleDash = d.lineStyle === 'dashed' ? [6, 6] : d.lineStyle === 'dotted' ? [2, 4] : [];
                ctx.globalAlpha = d.kind === 'highlighter' ? 0.35 : 1;
                ctx.font = '11px Trebuchet MS';
                ctx.setLineDash(styleDash);
                for (const L of g.lines) { ctx.beginPath(); ctx.moveTo(L[0], L[1]); ctx.lineTo(L[2], L[3]); ctx.stroke(); }
                ctx.setLineDash([5, 5]);
                for (const L of g.dashed) { ctx.beginPath(); ctx.moveTo(L[0], L[1]); ctx.lineTo(L[2], L[3]); ctx.stroke(); }
                ctx.setLineDash([]);
                for (const c of g.circles) { ctx.beginPath(); ctx.arc(c[0], c[1], c[2], 0, Math.PI * 2); ctx.stroke(); }
                for (const a of g.arcs) { ctx.beginPath(); ctx.arc(a[0], a[1], a[2], a[3], a[4]); ctx.stroke(); }
                for (const t of g.labels) ctx.fillText(t[0], t[1], t[2]);
                for (const t of g.texts) { ctx.font = t.size + 'px Trebuchet MS'; ctx.fillText(t.s, t.x, t.y); }
                for (const b of g.boxes) {
                    ctx.font = '11px Trebuchet MS';
                    const w = ctx.measureText(b.s).width + 10;
                    const bx = b.right ? b.x - w : b.x;
                    ctx.strokeRect(bx, b.y - 12, w, 18);
                    ctx.fillText(b.s, bx + 5, b.y + 1);
                }
                for (const gl of g.glyphs) {
                    if (gl.t === 'arrowhead') {
                        ctx.beginPath();
                        ctx.moveTo(gl.x, gl.y);
                        ctx.lineTo(gl.x - gl.l * Math.cos(gl.a - 0.4), gl.y - gl.l * Math.sin(gl.a - 0.4));
                        ctx.moveTo(gl.x, gl.y);
                        ctx.lineTo(gl.x - gl.l * Math.cos(gl.a + 0.4), gl.y - gl.l * Math.sin(gl.a + 0.4));
                        ctx.stroke();
                    } else if (gl.t === 'markup') {
                        ctx.beginPath(); ctx.moveTo(gl.x, gl.y - 8); ctx.lineTo(gl.x - 6, gl.y + 4); ctx.lineTo(gl.x + 6, gl.y + 4); ctx.closePath(); ctx.fill();
                        ctx.beginPath(); ctx.moveTo(gl.x, gl.y - 2); ctx.lineTo(gl.x, gl.y + 10); ctx.stroke();
                    } else if (gl.t === 'markdown') {
                        ctx.beginPath(); ctx.moveTo(gl.x, gl.y + 8); ctx.lineTo(gl.x - 6, gl.y - 4); ctx.lineTo(gl.x + 6, gl.y - 4); ctx.closePath(); ctx.fill();
                        ctx.beginPath(); ctx.moveTo(gl.x, gl.y + 2); ctx.lineTo(gl.x, gl.y - 10); ctx.stroke();
                    } else if (gl.t === 'pin') {
                        ctx.beginPath(); ctx.arc(gl.x, gl.y - 8, 5, Math.PI, 0); ctx.lineTo(gl.x, gl.y); ctx.closePath(); ctx.fill();
                    } else if (gl.t === 'flag') {
                        ctx.beginPath(); ctx.moveTo(gl.x, gl.y); ctx.lineTo(gl.x, gl.y - 14); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(gl.x, gl.y - 14); ctx.lineTo(gl.x + 10, gl.y - 11); ctx.lineTo(gl.x, gl.y - 8); ctx.closePath(); ctx.fill();
                    }
                }
                
                ctx.globalAlpha = 1; ctx.lineWidth = 2;

                // Phase 30 — Show bell icon on drawings with active alerts
                if (d.alert) {
                    const pts = d.points || [];
                    if (pts.length > 0) {
                        const alertY = py(pts[0].price);
                        if (alertY !== null) {
                            ctx.font = '14px Trebuchet MS';
                            ctx.fillText('🔔', 10, alertY + 5);
                        }
                    }
                }

                if (selectedDrawingIds.has(d.id) && !d.locked) {
                    const handles = getHandles(d);
                    for (const h of handles) {
                        ctx.fillStyle = COLORS.accent;
                        ctx.strokeStyle = '#FFFFFF';
                        ctx.lineWidth = 1.5;
                        ctx.fillRect(h.x - HANDLE_SIZE / 2, h.y - HANDLE_SIZE / 2, HANDLE_SIZE, HANDLE_SIZE);
                        ctx.strokeRect(h.x - HANDLE_SIZE / 2, h.y - HANDLE_SIZE / 2, HANDLE_SIZE, HANDLE_SIZE);
                    }
                    ctx.lineWidth = 2;
                }
            }
        }

        function applyTheme(c) {
            if (!c) return;
            COLORS.background = c.background; COLORS.grid = c.grid; COLORS.border = c.border;
            COLORS.textMuted = c.textMuted; COLORS.crosshair = c.crosshair; COLORS.accent = c.accent;
            COLORS.up = c.up; COLORS.down = c.down;
            COLORS.volumeUp = c.volumeUp; COLORS.volumeDown = c.volumeDown;
            document.body.style.background = c.background;
            chart.applyOptions({
                layout: { background: { type: LightweightCharts.ColorType.Solid, color: c.background }, textColor: c.textMuted },
                grid: { vertLines: { color: c.grid }, horzLines: { color: c.grid } },
                rightPriceScale: { borderColor: c.border },
                timeScale: { borderColor: c.border },
                crosshair: { vertLine: { color: c.crosshair, labelBackgroundColor: c.border }, horzLine: { color: c.crosshair, labelBackgroundColor: c.border } }
            });
            renderWithCurrentType();
        }

        function renderWithCurrentType() {
            if (activeSeries !== null) { chart.removeSeries(activeSeries); activeSeries = null; }
            markersApi = null; positionLines = [];

            activeSeries = createSeriesForType();
            displayData = buildDisplayData();
            activeSeries.setData(displayData);
            renderVolume();

            const total = displayData.length;
            if (total > 0) chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, total - 120), to: total + 4 });

            applyPositions();
            renderCustomDrawings();
        }

        renderWithCurrentType();
        chart.timeScale().subscribeVisibleTimeRangeChange(renderCustomDrawings);

        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', function (e) {
                const msg = e.data;
                if (!msg || !msg.type) return;

                if (msg.type === 'setCandles') {
                    rawData = msg.data;
                    chart.applyOptions({ timeScale: { secondsVisible: msg.secondsVisible === true } });
                    renderWithCurrentType();
                } else if (msg.type === 'setChartType') {
                    chartType = msg.chartType;
                    renderWithCurrentType();
                } else if (msg.type === 'setPositions') {
                    lastPositions = msg.positions || [];
                    applyPositions();
                } else if (msg.type === 'setDrawings') {
                    customDrawings = msg.drawings || [];
                    // Store groupId on each drawing for group operations
                    for (const d of customDrawings) {
                        if (!d.groupId) d.groupId = null;
                    }
                    for (const id of Array.from(selectedDrawingIds)) {
                        if (!customDrawings.some(d => d.id === id)) {
                            selectedDrawingIds.delete(id);
                        }
                    }
                    renderCustomDrawings();
                } else if (msg.type === 'setTheme') {
                    applyTheme(msg.colors);
                } else if (msg.type === 'setDrawingMode') {
                    const m = msg.mode;
                    if (msg.color) defaultColor = msg.color;
                    const multiKinds = ['polyline', 'brush', 'highlighter'];
                    if (multiKinds.includes(drawingMode) && !multiKinds.includes(m) && pendingPoints.length >= 2) {
                        const drawing = {
                            id: Date.now().toString(36) + Math.random().toString(36).substr(2),
                            kind: drawingMode,
                            color: defaultColor, label: '', alert: false,
                            points: pendingPoints.map(p => ({ time: p.time, price: p.price }))
                        };
                        post({ type: 'drawingCompleted', drawing: drawing });
                    }

                    if (m === 'cross' || m === 'dot' || m === 'arrow') {
                        cursorMode = m; drawingMode = null;
                        chart.applyOptions({ crosshair: { mode: m === 'arrow' ? LightweightCharts.CrosshairMode.Hidden : LightweightCharts.CrosshairMode.Normal } });
                        document.getElementById('chart').style.cursor = m === 'arrow' ? 'default' : 'crosshair';
                    } else if (m === 'eraser') {
                        drawingMode = 'eraser';
                        document.getElementById('chart').style.cursor = 'pointer';
                    } else {
                        drawingMode = m === 'none' ? null : m;
                        document.getElementById('chart').style.cursor = drawingMode ? 'crosshair' : 'default';
                    }
                    pendingPoints = [];
                    renderCustomDrawings();
                }
            });
        }

        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage(JSON.stringify({ type: 'requestDrawings' }));
        }

        const ctxMenu = document.getElementById('ctxMenu');
        let ctxPrice = null;

        function menuItem(label, act) {
            const d = document.createElement('div');
            d.className = 'ctx-item'; d.textContent = label;
            d.onmousedown = function (e) { e.stopPropagation(); };
            d.onclick = function () { ctxMenu.style.display = 'none'; act(); };
            return d;
        }
        function menuSep() { const d = document.createElement('div'); d.className = 'ctx-sep'; return d; }

        function openCtxMenu(x, y, price) {
            ctxPrice = price;
            ctxMenu.innerHTML = '';
            ctxMenu.style.background = COLORS.background;
            ctxMenu.style.borderColor = COLORS.border;
            ctxMenu.appendChild(menuItem('Reset chart view', function () {
                const total = displayData.length;
                if (total > 0) chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, total - 120), to: total + 4 });
            }));
            if (price != null) {
                ctxMenu.appendChild(menuItem('Copy price ' + fmtPrice(price), function () { post({ type: 'copyPrice', price: price }); }));
                ctxMenu.appendChild(menuItem('Add alert at ' + fmtPrice(price), function () { post({ type: 'addAlert', price: price }); }));
            }
            ctxMenu.appendChild(menuSep());
            ctxMenu.appendChild(menuItem('Chart settings…', function () { post({ type: 'openChartSettings' }); }));
            ctxMenu.style.display = 'block';
            const mw = ctxMenu.offsetWidth, mh = ctxMenu.offsetHeight;
            ctxMenu.style.left = Math.min(x, window.innerWidth - mw - 8) + 'px';
            ctxMenu.style.top = Math.min(y, window.innerHeight - mh - 8) + 'px';
        }

        document.getElementById('chart').addEventListener('contextmenu', function (e) {
            e.preventDefault();
            const rect = e.currentTarget.getBoundingClientRect();
            let price = null;
            if (activeSeries) {
                const p = activeSeries.coordinateToPrice(e.clientY - rect.top);
                if (p !== null && p !== undefined && !isNaN(p)) price = p;
            }
            openCtxMenu(e.clientX, e.clientY, price);
        });
        document.addEventListener('mousedown', function (e) {
            if (!ctxMenu.contains(e.target)) ctxMenu.style.display = 'none';
        });

        const TEXT_TOOLS = ['text', 'note', 'sticker'];
        const textInput = document.getElementById('textInput');
        let pendingTextDraw = null;

        function openTextInput(x, y, draw) {
            pendingTextDraw = draw;
            textInput.style.display = 'block';
            textInput.style.left = Math.min(x, window.innerWidth - 180) + 'px';
            textInput.style.top = Math.min(y, window.innerHeight - 40) + 'px';
            textInput.value = '';
            textInput.focus();
        }
        function finishTextInput(cancel) {
            if (!pendingTextDraw) { textInput.style.display = 'none'; return; }
            const draw = pendingTextDraw;
            pendingTextDraw = null;
            textInput.style.display = 'none';
            if (!cancel) {
                draw.label = textInput.value;
                post({ type: 'drawingCompleted', drawing: draw });
            }
        }
        textInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') finishTextInput(false);
            if (e.key === 'Escape') finishTextInput(true);
        });
        textInput.addEventListener('blur', function () { finishTextInput(false); });

        const chartEl = document.getElementById('chart');

        chartEl.addEventListener('dblclick', function (e) {
            if (drawingMode) {
                if (pendingPoints.length >= 2) {
                    const a = pendingPoints[pendingPoints.length - 1];
                    const b = pendingPoints[pendingPoints.length - 2];
                    if (a.time === b.time && a.price === b.price) pendingPoints.pop();
                }
                const multiKinds = ['polyline', 'brush', 'highlighter'];
                if (multiKinds.includes(drawingMode) && pendingPoints.length >= 2) {
                    const drawing = {
                        id: Date.now().toString(36) + Math.random().toString(36).substr(2),
                        kind: drawingMode,
                        color: defaultColor, label: '', alert: false,
                        points: pendingPoints.map(p => ({ time: p.time, price: p.price }))
                    };
                    pendingPoints = [];
                    post({ type: 'drawingCompleted', drawing: drawing });
                    renderCustomDrawings();
                }
                return;
            }

            const rect = chartEl.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            for (let i = customDrawings.length - 1; i >= 0; i--) {
                const d = customDrawings[i];
                if (!d.locked && hitTest(d, x, y)) {
                    selectedDrawingIds.clear();
                    selectedDrawingIds.add(d.id);
                    post({ type: 'openDrawingProperties', id: d.id });
                    renderCustomDrawings();
                    return;
                }
            }
        });

        // Phase 29 — Body drag: allows moving the entire drawing by dragging its body
        chartEl.addEventListener('mousedown', function (e) {
            if (drawingMode) return;
            if (e.button !== 0) return;
            const rect = chartEl.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Find the top-most drawing under the click
            let clickedDrawing = null;
            for (let i = customDrawings.length - 1; i >= 0; i--) {
                const d = customDrawings[i];
                if (!d.locked && hitTest(d, x, y)) {
                    clickedDrawing = d;
                    break;
                }
            }

            if (!clickedDrawing) return;

            // If clicked drawing is not selected, select it alone (unless Ctrl is pressed)
            if (!selectedDrawingIds.has(clickedDrawing.id)) {
                if (!isCtrlPressed) {
                    selectedDrawingIds.clear();
                }
                selectedDrawingIds.add(clickedDrawing.id);
                renderCustomDrawings();
            }

            // Check if clicking on a handle first
            const handle = hitTestHandle(clickedDrawing, x, y);

            if (handle) {
                // Handle drag (existing logic - move single point)
                dragState = {
                    drawingId: clickedDrawing.id,
                    handleIndex: handle.index,
                    priceOnly: !!handle.priceOnly,
                    timeOnly: !!handle.timeOnly,
                    committed: false,
                    isBodyDrag: fals,
                    groupId: clickedDrawing.groupId,
                    originalPoints: clickedDrawing.groupId ? customDrawings.filter(d => d.groupId === clickedDrawing.groupId && d.id !== clickedDrawing.id).map(d => ({ id: d.id, points: JSON.parse(JSON.stringify(d.points)) })) : []


                };
            } else {
                // Body drag — move all points of the drawing together
                const startPrice = activeSeries ? activeSeries.coordinateToPrice(y) : null;
                const startTime = chart.timeScale().coordinateToTime(x);
                if (startPrice === null || startPrice === undefined || startTime === null || startTime === undefined) return;

                dragState = {
                    drawingId: clickedDrawing.id,
                    handleIndex: null,
                    priceOnly: false,
                    timeOnly: false,
                    committed: false,
                    isBodyDrag: true,
                    lastPrice: startPrice,
                    lastTime: Math.round(startTime)
                };
            }

            isDragging = true;
            chart.applyOptions({ handleScroll: false, handleScale: false });
            e.preventDefault();
            e.stopPropagation();
        });

        window.addEventListener('mousemove', function (e) {
            if (!dragState) return;
            const rect = chartEl.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const d = customDrawings.find(d => d.id === dragState.drawingId);
            if (!d) { dragState = null; return; }

            if (!dragState.committed) {
                post({ type: 'captureSnapshot' });
                dragState.committed = true;
            }

            const newPrice = activeSeries ? activeSeries.coordinateToPrice(y) : null;
            const newTime = chart.timeScale().coordinateToTime(x);
            if (newPrice === null || newPrice === undefined) return;

            const pts = d.points || [];

            // If this drawing belongs to a group, move all group members together
            if (dragState.groupId && !dragState.isBodyDrag) {
                // Group members move together when any member is dragged
            }

            if (dragState.groupId && dragState.originalPoints && dragState.originalPoints.length > 0) {
                // Group drag: move all group members by the same delta
                const deltaPrice = newPrice - (dragState.startPrice || newPrice);
                const deltaTime = Math.round(newTime) - (dragState.startTime || Math.round(newTime));

                for (const member of dragState.originalPoints) {
                    const memberDrawing = customDrawings.find(d => d.id === member.id);
                    if (memberDrawing) {
                        for (let i = 0; i < memberDrawing.points.length && i < member.points.length; i++) {
                            memberDrawing.points[i].price = member.points[i].price + deltaPrice;
                            memberDrawing.points[i].time = member.points[i].time + deltaTime;
                        }
                    }
                }

                if (!dragState.startPrice) {
                    dragState.startPrice = newPrice;
                    dragState.startTime = Math.round(newTime);
                }
            }

            if (dragState.isBodyDrag) {
                // Move all points by the delta since last move
                const deltaPrice = newPrice - dragState.lastPrice;
                const deltaTime = Math.round(newTime) - dragState.lastTime;

                if (deltaPrice !== 0 || deltaTime !== 0) {
                    for (const p of pts) {
                        p.price = p.price + deltaPrice;
                        p.time = p.time + deltaTime;
                    }
                    dragState.lastPrice = newPrice;
                    dragState.lastTime = Math.round(newTime);
                }
            } else {
                // Handle drag — move only the specific point
                if (pts[dragState.handleIndex]) {
                    if (!dragState.timeOnly) pts[dragState.handleIndex].price = newPrice;
                    if (!dragState.priceOnly && newTime !== null && newTime !== undefined) {
                        pts[dragState.handleIndex].time = Math.round(newTime);
                    }
                }
            }
            renderCustomDrawings();
        });

        window.addEventListener('mouseup', function () {
            if (!dragState) return;
            const d = customDrawings.find(d => d.id === dragState.drawingId);
            if (d && dragState.committed) {
                post({
                    type: 'updateDrawing',
                    drawing: {
                        id: d.id,
                        kind: d.kind,
                        color: d.color,
                        label: d.label || '',
                        alert: !!d.alert,
                        points: (d.points || []).map(p => ({ time: p.time, price: p.price }))
                    }
                });
            }
            isDragging = false;
            if (dragState.groupId) {
                const groupDrawings = customDrawings.filter(dd => dd.groupId === dragState.groupId);
                post({
                    type: 'updateDrawings',
                    drawings: groupDrawings.map(dd => ({
                        id: dd.id,
                        points: (dd.points || []).map(p => ({ time: p.time, price: p.price }))
                    }))
                });
            }
            chart.applyOptions({ handleScroll: true, handleScale: true });
            dragState = null;
        });

        const NEED = {
            horizontal: 1, verticalline: 1, crossline: 1,
            parallelchannel: 3, flattopbottom: 3,
            pitchfork: 3, schiffpitchfork: 3, modifiedschiffpitchfork: 3, insidepitchfork: 3,
            disjointchannel: 4,
            rectangle: 2, circle: 2, ellipse: 2, arc: 3, triangle: 3,
            polyline: 20, rotatedrectangle: 3,
            arrow: 2, arrowmarkup: 1, arrowmarkdown: 1, brush: 20, highlighter: 20,
            text: 1, note: 1, pricelabel: 1, pin: 1, flag: 1, sticker: 1
        };

        chart.subscribeClick(function (param) {
            if (!param.point) return;
            if (isDragging) return;
            const x = param.point.x, y = param.point.y;

            if (drawingMode === 'eraser') {
                for (let i = customDrawings.length - 1; i >= 0; i--) {
                    if (!customDrawings[i].locked && hitTest(customDrawings[i], x, y)) {
                        post({ type: 'deleteDrawing', id: customDrawings[i].id });
                        return;
                    }
                }
                return;
            }

            if (!drawingMode) {
                let found = null;
                for (let i = customDrawings.length - 1; i >= 0; i--) {
                    if (!customDrawings[i].locked && hitTest(customDrawings[i], x, y)) { found = customDrawings[i]; break; }
                }

                if (!isCtrlPressed) {
                    selectedDrawingIds.clear();
                }

                if (found) {
                    if (selectedDrawingIds.has(found.id)) {
                        selectedDrawingIds.delete(found.id);
                    } else {
                        selectedDrawingIds.add(found.id);
                    }
                }

                renderCustomDrawings();
                return;
            }

            if (!drawingMode || !param.time) return;
            const price = activeSeries.coordinateToPrice(y);
            if (price === null || price === undefined) return;

            pendingPoints.push({ time: param.time, price: price });

            const need = NEED[drawingMode] || 2;
            const isMulti = drawingMode === 'polyline' || drawingMode === 'brush' || drawingMode === 'highlighter';

            if (!isMulti && pendingPoints.length >= need) {
                const drawing = {
                    id: Date.now().toString(36) + Math.random().toString(36).substr(2),
                    kind: drawingMode,
                    color: defaultColor,
                    label: '',
                    alert: false,
                    points: pendingPoints.slice(0, need).map(p => ({ time: p.time, price: p.price }))
                };
                if (TEXT_TOOLS.includes(drawingMode)) {
                    openTextInput(x, y, drawing);
                } else {
                    post({ type: 'drawingCompleted', drawing: drawing });
                }
                pendingPoints = [];
                renderCustomDrawings();
            } else {
                renderCustomDrawings();
            }
        });

        chart.subscribeCrosshairMove(function (param) {
            if (!window.chrome || !window.chrome.webview) return;
            if (isDragging) return;
            if (!param || !param.time) {
                window.chrome.webview.postMessage(JSON.stringify({ type: 'crosshair', hasData: false }));
                return;
            }
            let hovered = displayData.find(d => d.time === param.time);
            if (!hovered || hovered.open === undefined) hovered = rawData.find(d => d.time === param.time);
            if (!hovered || hovered.open === undefined) {
                window.chrome.webview.postMessage(JSON.stringify({ type: 'crosshair', hasData: false }));
                return;
            }
            const ohlcList = (displayData.length > 0 && displayData[0].open !== undefined) ? displayData : rawData;
            const idx = ohlcList.findIndex(d => d.time === hovered.time);
            const prev = idx > 0 ? ohlcList[idx - 1] : hovered;
            window.chrome.webview.postMessage(JSON.stringify({
                type: 'crosshair', hasData: true,
                open: hovered.open, high: hovered.high, low: hovered.low, close: hovered.close,
                prevOpen: prev.open, prevHigh: prev.high, prevLow: prev.low, prevClose: prev.close
            }));
        });
    </script>
</body>
</html>
