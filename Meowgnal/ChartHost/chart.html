<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Meowgnal Chart Host</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #131722;
        }

        #chartContainer {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #paneMain {
            position: relative;
            flex: 1 1 auto;
            min-height: 120px;
        }

        .ind-pane {
            position: relative;
            flex: 0 0 120px;
            border-top: 1px solid #2A2E39;
        }

        #overlayLabels {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 4;
        }

        .ind-label {
            position: absolute;
            top: 4px;
            left: 8px;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: Trebuchet MS,sans-serif;
            font-size: 12px;
            font-weight: 600;
            pointer-events: none;
            padding: 2px 6px;
        }

            .ind-label .dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
            }

            .ind-label.dim {
                opacity: .4;
            }

        .ind-toolbar {
            position: absolute;
            top: 4px;
            right: 70px;
            z-index: 7;
            display: none;
            align-items: center;
            gap: 2px;
            padding: 2px 4px;
            border-radius: 8px;
            background: rgba(128,128,128,.14);
            border: none;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }

        #paneMain:hover .ind-toolbar, .ind-pane:hover .ind-toolbar {
            display: flex;
        }

        .ind-toolbar button {
            width: 26px;
            height: 26px;
            border: 0;
            background: transparent;
            border-radius: 6px;
            font-size: 15px;
            line-height: 1;
            cursor: pointer;
        }

            .ind-toolbar button:hover {
                background: rgba(128,128,128,.25);
            }

        #ctxMenu {
            position: fixed;
            display: none;
            z-index: 10;
            border: 1px solid #2A2E39;
            border-radius: 6px;
            padding: 4px;
            min-width: 220px;
            font-family: Trebuchet MS,sans-serif;
            font-size: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,.45);
        }

        .ctx-item {
            padding: 7px 10px;
            border-radius: 4px;
            cursor: pointer;
            color: #D1D4DC;
        }

            .ctx-item:hover {
                background: #363A45;
            }

        .ctx-sep {
            height: 1px;
            background: #2A2E39;
            margin: 4px;
        }

        #textInput {
            position: fixed;
            display: none;
            z-index: 20;
            background: #1E222D;
            color: #D1D4DC;
            border: 1px solid #2962FF;
            border-radius: 4px;
            padding: 4px 8px;
            width: 160px;
            font-family: Trebuchet MS,sans-serif;
            font-size: 12px;
            outline: none;
        }

        #hoverTooltip {
            position: fixed;
            display: none;
            z-index: 100;
            background: #1E222D;
            border: 1px solid #2A2E39;
            border-radius: 4px;
            padding: 6px 10px;
            color: #D1D4DC;
            font-size: 11px;
            font-family: Trebuchet MS, sans-serif;
            pointer-events: none;
            max-width: 250px;
        }

        #longPressTooltip {
            position: fixed;
            display: none;
            z-index: 120;
            background: rgba(30, 34, 45, 0.95);
            border: 1px solid #2A2E39;
            border-radius: 6px;
            padding: 8px 10px;
            color: #D1D4DC;
            font-size: 11px;
            font-family: Trebuchet MS, sans-serif;
            pointer-events: none;
            line-height: 1.6;
        }

            #longPressTooltip .lp-time {
                color: #787B86;
                margin-bottom: 2px;
            }

            #longPressTooltip span {
                color: #787B86;
            }

        #indSettings {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.4);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .is-box {
            background: #1E222D;
            border: 1px solid #2A2E39;
            border-radius: 8px;
            padding: 16px;
            min-width: 250px;
            font-family: Trebuchet MS,sans-serif;
            color: #D1D4DC;
            font-size: 12px;
        }

            .is-box label {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin: 8px 0;
                gap: 10px;
            }

            .is-box input, .is-box select {
                background: #131722;
                color: #D1D4DC;
                border: 1px solid #2A2E39;
                border-radius: 4px;
                padding: 4px 6px;
            }

        .is-title {
            font-weight: bold;
            margin-bottom: 6px;
        }

        .is-btns {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 10px;
        }

            .is-btns button {
                background: #2962FF;
                border: 0;
                color: #fff;
                border-radius: 4px;
                padding: 5px 10px;
                cursor: pointer;
            }

            .is-btns #isCancel {
                background: #363A45;
            }

        .chart-table {
            position: absolute;
            z-index: 3;
            pointer-events: auto;
        }

            .chart-table table {
                border-collapse: collapse;
                font-family: Trebuchet MS, sans-serif;
                font-size: 11px;
            }

            .chart-table td {
                border: 1px solid #2A2E39;
                padding: 4px 6px;
                color: #D1D4DC;
                min-width: 50px;
                outline: none;
            }

                .chart-table td:focus {
                    background: rgba(41, 98, 255, 0.2);
                }
    </style>
    <script src="lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <script>
        // Paint with the last used theme immediately (prevents a dark flash on startup)
        (function () {
            try {
                var s = localStorage.getItem('meowgnal.chart.colors');
                if (s) {
                    var c = JSON.parse(s);
                    if (c && c.background) {
                        document.documentElement.style.background = c.background;
                        document.body.style.background = c.background;
                        window.__INITIAL_COLORS__ = c;
                    }
                }
            } catch (e) { }
        })();
    </script>
    <div id="chartContainer"><div id="paneMain"><div id="overlayLabels"></div></div></div>
    <div id="ctxMenu"></div>
    <div id="hoverTooltip"></div>
    <div id="longPressTooltip"></div>
    <input id="textInput" />
    <div id="indSettings">
        <div class="is-box">
            <div class="is-title" id="isTitle">Indicator settings</div>
            <label id="isPeriodRow">Period <input id="isPeriod" type="number" min="1" max="500" /></label>
            <label>Color <input id="isColor" type="color" /></label>
            <label>Line width <select id="isWidth"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
            <div class="is-btns"><button id="isCancel">Cancel</button><button id="isSave">Save</button></div>
        </div>
    </div>
    <script>
        const COLORS = Object.assign({
            background: '#131722', grid: '#1E222D', border: '#2A2E39', textPrimary: '#D1D4DC',
            textMuted: '#787B86', crosshair: '#758696', accent: '#2962FF', up: '#089981', down: '#F23645',
            volumeUp: 'rgba(8,153,129,0.35)', volumeDown: 'rgba(242,54,69,0.35)'
        }, window.__INITIAL_COLORS__ || {});
        const FIB_LEVELS = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1];
        function legRatio(pts, i1, i2, i3, i4) {
            const len1 = Math.abs(pts[i2].price - pts[i1].price);
            const len2 = Math.abs(pts[i4].price - pts[i3].price);
            if (len1 === 0) return 0;
            return len2 / len1;
        }
        const FIB_EXTENSION_LEVELS = [1.272, 1.618, 2.618];
        const ALL_FIB_LEVELS = FIB_LEVELS.concat(FIB_EXTENSION_LEVELS);
        const chartContainer = document.getElementById('chartContainer');
        const paneMain = document.getElementById('paneMain');
        const overlayLabels = document.getElementById('overlayLabels');
        const hoverTooltip = document.getElementById('hoverTooltip');
        function baseChartOptions() {
            return {
                autoSize: true,
                layout: {
                    background: { type: LightweightCharts.ColorType.Solid, color: COLORS.background },
                    textColor: COLORS.textMuted, fontSize: 11,
                    fontFamily: "-apple-system,BlinkMacSystemFont,'Trebuchet MS',Roboto,Ubuntu,Helvetica,Arial,sans-serif"
                },
                grid: { vertLines: { color: COLORS.grid }, horzLines: { color: COLORS.grid } },
                rightPriceScale: { borderColor: COLORS.border },
                timeScale: { borderColor: COLORS.border, timeVisible: true, secondsVisible: false },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                    vertLine: { color: COLORS.crosshair, labelBackgroundColor: COLORS.border },
                    horzLine: { color: COLORS.crosshair, labelBackgroundColor: COLORS.border }
                }
            };
        }
        const chart = LightweightCharts.createChart(paneMain, baseChartOptions());
        const volumeSeries = chart.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: '' });
        chart.priceScale('').applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
        // ---------- Multi-pane infrastructure (v4 has no addPane: synced stacked charts) ----------
        const panes = [];
        const indicatorState = new Map();
        const overrides = {};
        let syncingRange = false;
        let syncingCrosshair = false;
        let blindMode = false;
        const primarySeriesByChart = new Map();
        const valueByTimeByChart = new Map();
        function allCharts() { return [chart].concat(panes.map(p => p.chart)); }
        function attachRangeSync(c) {
            c.timeScale().subscribeVisibleLogicalRangeChange(range => {
                if (!range || syncingRange) return;
                syncingRange = true;
                allCharts().forEach(o => {
                    if (o === c) return;
                    const cur = o.timeScale().getVisibleLogicalRange();
                    if (!cur || Math.abs(cur.from - range.from) > 1e-6 || Math.abs(cur.to - range.to) > 1e-6)
                        o.timeScale().setVisibleLogicalRange(range);
                });
                syncingRange = false;
            });
        }
        function attachCrosshairSync(c) {
            c.subscribeCrosshairMove(param => {
                if (syncingCrosshair) return;
                syncingCrosshair = true;
                try {
                    allCharts().forEach(o => {
                        if (o === c) return;
                        const s = primarySeriesByChart.get(o);
                        if (!s) return;
                        if (param.time !== undefined) {
                            const m = valueByTimeByChart.get(o);
                            const v = m ? m.get(param.time) : undefined;
                            if (v !== undefined) { try { o.setCrosshairPosition(v, param.time, s); } catch (e) { } }
                            else { try { o.clearCrosshairPosition(); } catch (e) { } }
                        } else { try { o.clearCrosshairPosition(); } catch (e) { } }
                    });
                } finally { syncingCrosshair = false; }
            });
        }
        attachRangeSync(chart);
        attachCrosshairSync(chart);
        function setChartPrimary(c, series, points) {
            primarySeriesByChart.set(c, series);
            const m = new Map();
            if (points) for (const p of points) if (p && p.value !== undefined && !isNaN(p.value)) m.set(p.time, p.value);
            valueByTimeByChart.set(c, m);
        }
        function updateTimeScaleVisibility() {
            const last = panes.length ? panes[panes.length - 1].chart : chart;
            allCharts().forEach(c => c.applyOptions({ timeScale: { visible: c === last && !blindMode } }));
            if (activeSeries) activeSeries.applyOptions({ lastValueVisible: !blindMode });
            chart.applyOptions({ rightPriceScale: { borderVisible: !blindMode } });
        }
        function createPane(id) {
            const div = document.createElement('div');
            div.className = 'ind-pane';
            div.id = 'pane-' + id;
            div.style.borderTopColor = COLORS.border;
            chartContainer.appendChild(div);
            const pChart = LightweightCharts.createChart(div, baseChartOptions());
            attachRangeSync(pChart);
            attachCrosshairSync(pChart);
            const pane = { id, div, chart: pChart };
            panes.push(pane);
            updateTimeScaleVisibility();
            const r = chart.timeScale().getVisibleLogicalRange();
            if (r) pChart.timeScale().setVisibleLogicalRange(r);
            resizeCanvasSoon();
            return pane;
        }
        function destroyPane(pane) {
            primarySeriesByChart.delete(pane.chart);
            valueByTimeByChart.delete(pane.chart);
            try { pane.chart.remove(); } catch (e) { }
            pane.div.remove();
            const i = panes.indexOf(pane);
            if (i >= 0) panes.splice(i, 1);
            updateTimeScaleVisibility();
            resizeCanvasSoon();
        }
        // ---------- Core state ----------
        let rawData = [];
        let displayData = [];
        let chartType = 'candles';
        let activeSeries = null;
        let lastPositions = [];
        let positionLines = [];
        let markersApi = null;
        let drawingMode = null;
        let pendingPoints = [];
        let customDrawings = [];
        let defaultColor = '#2962FF';
        let selectedDrawingIds = new Set();
        let isCtrlPressed = false;
        let dragState = null;
        let isDragging = false;
        let freehand = null;
        let measureState = null;
        const HANDLE_SIZE = 10;
        let clipboardDrawing = null;
        const drawCanvas = document.createElement('canvas');
        drawCanvas.style.position = 'absolute';
        drawCanvas.style.top = '0';
        drawCanvas.style.left = '0';
        drawCanvas.style.pointerEvents = 'none';
        drawCanvas.style.zIndex = '3';
        paneMain.appendChild(drawCanvas);
        const ctx = drawCanvas.getContext('2d');
        function resizeCanvas() {
            drawCanvas.width = paneMain.clientWidth;
            drawCanvas.height = paneMain.clientHeight;
            renderCustomDrawings();
        }
        let resizeTimer = null;
        function resizeCanvasSoon() {
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(resizeCanvas, 60);
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('keydown', function (e) {
            if (e.key === 'Control') isCtrlPressed = true;
            if (e.key === 'g' && isCtrlPressed && !e.shiftKey && selectedDrawingIds.size >= 2)
                post({ type: 'groupDrawings', ids: Array.from(selectedDrawingIds), groupId: Date.now().toString(36) });
            if (e.key === 'G' && isCtrlPressed && e.shiftKey && selectedDrawingIds.size > 0)
                post({ type: 'ungroupDrawings', ids: Array.from(selectedDrawingIds) });
        });
        window.addEventListener('keyup', function (e) {
            if (e.key === 'Control') isCtrlPressed = false;
            if (e.key === 'Delete' && selectedDrawingIds.size > 0) {
                post({ type: 'deleteDrawings', ids: Array.from(selectedDrawingIds) });
                selectedDrawingIds.clear();
                renderCustomDrawings();
                return;
            }
            if (e.key === 'Escape') {
                if (pendingPoints.length > 0) { pendingPoints = []; renderCustomDrawings(); return; }
                if (selectedDrawingIds.size > 0) { selectedDrawingIds.clear(); renderCustomDrawings(); }
            }
        });
        resizeCanvas();
        function post(m) {
            if (window.chrome && window.chrome.webview)
                window.chrome.webview.postMessage(JSON.stringify(m));
        }
        function copySelectedDrawing() {
            if (selectedDrawingIds.size > 0) {
                const src = customDrawings.find(d => d.id === Array.from(selectedDrawingIds)[0]);
                if (src) { clipboardDrawing = JSON.parse(JSON.stringify(src)); post({ type: 'copyToast' }); }
            }
        }
        function pasteCopiedDrawing() {
            if (clipboardDrawing) {
                const copy = JSON.parse(JSON.stringify(clipboardDrawing));
                copy.id = Date.now().toString(36) + Math.random().toString(36).substr(2);
                const dt = rawData.length > 1 ? (rawData[1].time - rawData[0].time) : 3600;
                for (const p of copy.points || []) { p.time = p.time + dt; p.price = p.price * 1.002; }
                post({ type: 'pasteDrawing', drawing: copy });
            }
        }
        function fmtPrice(p) {
            if (p >= 1000) return p.toFixed(2);
            if (p >= 1) return p.toFixed(4);
            return p.toFixed(8);
        }
        function fmtTime(t) {
            const d = new Date(t * 1000);
            const mo = (d.getUTCMonth() + 1).toString().padStart(2, '0');
            const da = d.getUTCDate().toString().padStart(2, '0');
            const hh = d.getUTCHours().toString().padStart(2, '0');
            const mm = d.getUTCMinutes().toString().padStart(2, '0');
            return mo + '/' + da + ' ' + hh + ':' + mm;
        }
        function fmtDuration(sec) {
            if (sec >= 86400 * 2) return Math.round(sec / 86400) + 'd';
            if (sec >= 86400) return (sec / 86400).toFixed(1) + 'd';
            if (sec >= 3600) return (sec / 3600).toFixed(1) + 'h';
            return Math.round(sec / 60) + 'm';
        }
        function createSeriesForType() {
            switch (chartType) {
                case 'line': return chart.addLineSeries({ color: COLORS.accent, lineWidth: 2 });
                case 'area': return chart.addAreaSeries({ lineColor: COLORS.accent, topColor: 'rgba(41,98,255,0.35)', bottomColor: 'rgba(41,98,255,0.03)', lineWidth: 2 });
                case 'bars': return chart.addBarSeries({ upColor: COLORS.up, downColor: COLORS.down });
                default: return chart.addCandlestickSeries({
                    upColor: COLORS.up, downColor: COLORS.down,
                    borderUpColor: COLORS.up, borderDownColor: COLORS.down,
                    wickUpColor: COLORS.up, wickDownColor: COLORS.down,
                    priceFormat: { type: 'price', precision: 2, minMove: 0.01 }
                });
            }
        }
        function heikinAshi(candles) {
            const ha = []; let po = null, pc = null;
            for (const c of candles) {
                const hc = (c.open + c.high + c.low + c.close) / 4;
                const ho = po === null ? (c.open + c.close) / 2 : (po + pc) / 2;
                ha.push({ time: c.time, open: ho, high: Math.max(c.high, ho, hc), low: Math.min(c.low, ho, hc), close: hc });
                po = ho; pc = hc;
            }
            return ha;
        }
        function buildDisplayData() {
            if (chartType === 'heikinashi') return heikinAshi(rawData);
            if (chartType === 'line' || chartType === 'area')
                return rawData.map(c => ({ time: c.time, value: c.close }));
            return rawData;
        }
        function renderVolume() {
            volumeSeries.setData(rawData.map(c => ({
                time: c.time, value: c.volume,
                color: c.close >= c.open ? COLORS.volumeUp : COLORS.volumeDown
            })));
        }
        function appendCandle(c) {
            const range = chart.timeScale().getVisibleLogicalRange();
            const totalBefore = rawData.length;
            const following = range && range.to >= totalBefore - 1;
            rawData.push(c);
            const mm = valueByTimeByChart.get(chart);
            if (mm) mm.set(c.time, c.close);
            if (activeSeries) {
                if (chartType === 'line' || chartType === 'area') activeSeries.update({ time: c.time, value: c.close });
                else activeSeries.update(c);
            }
            volumeSeries.update({ time: c.time, value: c.volume, color: c.close >= c.open ? COLORS.volumeUp : COLORS.volumeDown });
            if (following) chart.timeScale().setVisibleLogicalRange({ from: range.from + 1, to: range.to + 1 });
            renderCustomDrawings();
        }
        // ---------- Indicator labels / toolbars / settings ----------
        const OVERLAY_TYPES = new Set(['sma', 'ema', 'wma', 'hma', 'dema', 'tema', 'kama', 'vwma', 'vwap', 'bbands', 'keltner', 'donchian', 'sar', 'supertrend', 'ichimoku']);
        const DEFAULT_COLORS = {
            sma: '#2962FF', ema: '#FF9800', wma: '#00BCD4', hma: '#9C27B0', dema: '#4CAF50', tema: '#795548',
            kama: '#E91E63', vwma: '#3F51B5', vwap: '#E91E63', bbands: '#2962FF', keltner: '#00BCD4',
            donchian: '#FF9800', sar: '#F23645', supertrend: '#089981', ichimoku: '#2962FF',
            rsi: '#9C27B0', stoch: '#9C27B0', stochrsi: '#E91E63', cci: '#00BCD4', williamsr: '#FF9800',
            mfi: '#4CAF50', roc: '#3F51B5', trix: '#795548', ultimate: '#E91E63', ao: '#089981',
            cmo: '#00BCD4', connorsrsi: '#9C27B0', macd: '#2962FF', adx: '#FF5722', atr: '#00BCD4',
            stddev: '#3F51B5', ulcer: '#F23645', volsma: '#4CAF50', obv: '#4CAF50', cmf: '#089981',
            forceindex: '#FF9800', adl: '#00BCD4', aroon: '#089981', vortex: '#089981', chop: '#787B86',
            feargreed: '#FF9800', btcdom: '#F7A600', funding: '#9C27B0', oi: '#00BCD4'
        };
        const PANE_SCALES = {
            rsi: { range: [0, 100], guides: [30, 70] }, stoch: { range: [0, 100], guides: [20, 80] },
            stochrsi: { range: [0, 100], guides: [20, 80] }, mfi: { range: [0, 100], guides: [20, 80] },
            williamsr: { range: [-100, 0], guides: [-80, -20] }, adx: { range: [0, 100], guides: [25] },
            cmo: { range: [-100, 100], guides: null }, ultimate: { range: [0, 100], guides: [30, 70] },
            connorsrsi: { range: [0, 100], guides: [10, 90] }, chop: { range: [0, 100], guides: [38.2, 61.8] },
            feargreed: { range: [0, 100], guides: [25, 75] }, cmf: { range: null, guides: [0] }, funding: { range: null, guides: [0] }
        };
        const NO_PERIOD_KINDS = ['vwap', 'sar', 'obv', 'adl', 'ao', 'feargreed', 'btcdom', 'funding', 'oi'];
        function makeLabel(state) {
            const el = document.createElement('div');
            el.className = 'ind-label';
            const dot = document.createElement('span');
            dot.className = 'dot';
            dot.style.background = state.color;
            const name = document.createElement('span');
            name.textContent = state.label;
            el.appendChild(dot); el.appendChild(name);
            el.style.color = COLORS.textPrimary;
            state.dotEl = dot;
            return el;
        }
        function makeToolbar(state) {
            const tb = document.createElement('div');
            tb.className = 'ind-toolbar';
            const mk = (icon, title, act) => {
                const b = document.createElement('button');
                b.textContent = icon; b.title = title; b.dataset.act = act;
                b.style.color = COLORS.textPrimary;
                tb.appendChild(b); return b;
            };
            state.eyeBtn = mk('\u{1F441}\uFE0E', 'Show / hide', 'eye');
            mk('\u2699\uFE0E', 'Settings (period, color, width)', 'settings');
            if (state.displayMode === 'Pane') mk('\u2191', 'Move pane up', 'up');
            mk('\u{1F5D1}\uFE0E', 'Remove', 'remove');
            tb.addEventListener('click', e => {
                const b = e.target.closest('button');
                if (!b) return;
                e.stopPropagation();
                const act = b.dataset.act;
                if (act === 'eye') toggleVisibility(state);
                else if (act === 'remove') removeIndicator(state);
                else if (act === 'up') movePaneUp(state);
                else if (act === 'settings') openSettings(state);
            });
            return tb;
        }
        function toggleVisibility(st) {
            st.visible = !st.visible;
            st.seriesRecs.forEach(r => { if (!r.lock) r.series.applyOptions({ visible: st.visible }); });
            if (st.labelEl) st.labelEl.classList.toggle('dim', !st.visible);
            if (st.eyeBtn) st.eyeBtn.style.opacity = st.visible ? '1' : '.45';

            textInput.style.left = Math.min(x, window.innerWidth - 180) + 'px';
            textInput.style.top = Math.min(y, window.innerHeight - 40) + 'px';
            textInput.value = '';
            textInput.focus();
        }
        function finishTextInput(cancel) {
            if (!pendingTextDraw) { textInput.style.display = 'none'; return; }
            const draw = pendingTextDraw;
            pendingTextDraw = null;
            textInput.style.display = 'none';
            if (!cancel) { draw.label = textInput.value; post({ type: 'drawingCompleted', drawing: draw }); }
        }
        textInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') finishTextInput(false);
            if (e.key === 'Escape') finishTextInput(true);
        });
        textInput.addEventListener('blur', function () { finishTextInput(false); });
        chartEl.addEventListener('dblclick', function (e) {
            if (drawingMode) {
                if (pendingPoints.length >= 2) {
                    const a = pendingPoints[pendingPoints.length - 1];
                    const b = pendingPoints[pendingPoints.length - 2];
                    if (a.time === b.time && a.price === b.price) pendingPoints.pop();
                }
                const multiKinds = ['polyline', 'path'];
                if (multiKinds.includes(drawingMode) && pendingPoints.length >= 2) {
                    post({
                        type: 'drawingCompleted', drawing: {
                            id: Date.now().toString(36) + Math.random().toString(36).substr(2),
                            kind: drawingMode, color: defaultColor, label: '', alert: false,
                            points: pendingPoints.map(p => ({ time: p.time, price: p.price }))
                        }
                    });
                    pendingPoints = [];
                    renderCustomDrawings();
                }
                return;
            }
            const rect = chartEl.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            for (let i = customDrawings.length - 1; i >= 0; i--) {
                const d = customDrawings[i];
                if (!d.locked && hitTest(d, x, y)) {
                    selectedDrawingIds.clear();
                    selectedDrawingIds.add(d.id);
                    post({ type: 'openDrawingProperties', id: d.id });
                    renderCustomDrawings();
                    return;
                }
            }
        });
        chartEl.addEventListener('mousedown', function (e) {
            if (drawingMode === 'measure') {
                if (e.button !== 0) return;
                const rect = chartEl.getBoundingClientRect();
                const t = chart.timeScale().coordinateToTime(e.clientX - rect.left);
                const p = activeSeries ? activeSeries.coordinateToPrice(e.clientY - rect.top) : null;
                if (t !== null && p !== null && p !== undefined) {
                    measureState = {
                        startTime: snapToBarTime(t),
                        startPrice: p,
                        endTime: snapToBarTime(t),
                        endPrice: p
                    };
                    isDragging = true;
                    chart.applyOptions({ handleScroll: false, handleScale: false });
                    renderCustomDrawings();
                    e.preventDefault();
                    e.stopPropagation();
                }
                return;
            }
            if (drawingMode === 'brush' || drawingMode === 'highlighter') {
                if (e.button !== 0) return;
                const rect = chartEl.getBoundingClientRect();
                freehand = { points: [] };
                const t = chart.timeScale().coordinateToTime(e.clientX - rect.left);
                const p = activeSeries ? activeSeries.coordinateToPrice(e.clientY - rect.top) : null;
                if (t !== null && p !== null && p !== undefined) freehand.points.push({ time: snapToBarTime(t), price: p });
                isDragging = true;
                chart.applyOptions({ handleScroll: false, handleScale: false });
                e.preventDefault();
                e.stopPropagation();
                return;
            }
            if (drawingMode) return;
            if (e.button !== 0) return;
            const rect = chartEl.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            let clickedDrawing = null;
            for (let i = customDrawings.length - 1; i >= 0; i--) {
                const d = customDrawings[i];
                if (!d.locked && hitTest(d, x, y)) { clickedDrawing = d; break; }
            }
            if (!clickedDrawing) return;
            if (!selectedDrawingIds.has(clickedDrawing.id)) {
                if (!isCtrlPressed) selectedDrawingIds.clear();
                selectedDrawingIds.add(clickedDrawing.id);
                renderCustomDrawings();
            }
            const handle = hitTestHandle(clickedDrawing, x, y);
            if (handle) {
                dragState = {
                    drawingId: clickedDrawing.id, handleIndex: handle.index,
                    priceOnly: !!handle.priceOnly, timeOnly: !!handle.timeOnly,
                    committed: false, isBodyDrag: false, resizeInfo: handle.resizeInfo || null,
                    groupId: clickedDrawing.groupId,
                    isAnchored: !!handle.isAnchored,
                    originalPoints: clickedDrawing.groupId ? customDrawings.filter(d => d.groupId === clickedDrawing.groupId && d.id !== clickedDrawing.id).map(d => ({ id: d.id, points: JSON.parse(JSON.stringify(d.points)) })) : []
                };
            } else {
                const startPrice = activeSeries ? activeSeries.coordinateToPrice(y) : null;
                const startTime = chart.timeScale().coordinateToTime(x);
                if (startPrice === null || startPrice === undefined || startTime === null || startTime === undefined) return;
                dragState = {
                    drawingId: clickedDrawing.id, handleIndex: null, priceOnly: false, timeOnly: false,
                    committed: false, isBodyDrag: true, lastPrice: startPrice, lastTime: Math.round(startTime),
                    groupId: clickedDrawing.groupId,
                    isAnchored: clickedDrawing.kind === 'anchoredtext' || clickedDrawing.kind === 'anchorednote',
                    originalPoints: clickedDrawing.groupId ? customDrawings.filter(d => d.groupId === clickedDrawing.groupId && d.id !== clickedDrawing.id).map(d => ({ id: d.id, points: JSON.parse(JSON.stringify(d.points)) })) : []
                };
            }
            isDragging = true;
            chart.applyOptions({ handleScroll: false, handleScale: false });
            e.preventDefault();
            e.stopPropagation();
        });
        window.addEventListener('mousemove', function (e) {
            if (measureState) {
                const rect = chartEl.getBoundingClientRect();
                const t = chart.timeScale().coordinateToTime(e.clientX - rect.left);
                const p = activeSeries ? activeSeries.coordinateToPrice(e.clientY - rect.top) : null;
                if (t !== null && p !== null && p !== undefined) {
                    measureState.endTime = snapToBarTime(t);
                    measureState.endPrice = p;
                    renderCustomDrawings();
                }
                return;
            }
            if (freehand) {
                const rect = chartEl.getBoundingClientRect();
                const t = chart.timeScale().coordinateToTime(e.clientX - rect.left);
                const p = activeSeries ? activeSeries.coordinateToPrice(e.clientY - rect.top) : null;
                if (t !== null && p !== null && p !== undefined) {
                    const pt = { time: snapToBarTime(t), price: p };
                    const lastPt = freehand.points[freehand.points.length - 1];
                    if (!lastPt || lastPt.time !== pt.time || lastPt.price !== pt.price) freehand.points.push(pt);
                    pendingPoints = freehand.points;
                    renderCustomDrawings();
                }
                return;
            }
            if (!dragState) {
                const rect = chartEl.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                let hoveredDrawing = null;
                if (!drawingMode && mx >= 0 && my >= 0 && mx <= rect.width && my <= rect.height) {
                    for (let i = customDrawings.length - 1; i >= 0; i--) {
                        if (hitTest(customDrawings[i], mx, my)) { hoveredDrawing = customDrawings[i]; break; }
                    }
                }
                if (hoveredDrawing) {
                    const kindLabel = getKindLabel(hoveredDrawing.kind);
                    const priceInfo = hoveredDrawing.points && hoveredDrawing.points.length > 0 ? ' @ ' + fmtPrice(hoveredDrawing.points[0].price) : '';
                    const labelInfo = hoveredDrawing.label ? ' — ' + hoveredDrawing.label : '';
                    const groupInfo = hoveredDrawing.groupId ? ' [Grouped]' : '';
                    hoverTooltip.textContent = kindLabel + priceInfo + labelInfo + groupInfo;
                    hoverTooltip.style.display = 'block';
                    hoverTooltip.style.left = (e.clientX + 12) + 'px';
                    hoverTooltip.style.top = (e.clientY + 12) + 'px';
                } else hoverTooltip.style.display = 'none';
                return;
            }
            const rect = chartEl.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const d = customDrawings.find(d => d.id === dragState.drawingId);
            if (!d) { dragState = null; return; }
            if (!dragState.committed) { post({ type: 'captureSnapshot' }); dragState.committed = true; }
            const newPrice = activeSeries ? activeSeries.coordinateToPrice(y) : null;
            const newTime = chart.timeScale().coordinateToTime(x);
            if (newPrice === null || newPrice === undefined) return;
            const pts = d.points || [];
            if (dragState.isAnchored) {
                d.anchoredPixelX = x;
                d.anchoredPixelY = y;
            } else if (dragState.resizeInfo) {
                if (dragState.resizeInfo.timePoint !== undefined && pts[dragState.resizeInfo.timePoint]) {
                    if (newTime !== null && newTime !== undefined) pts[dragState.resizeInfo.timePoint].time = Math.round(newTime);
                }
                if (dragState.resizeInfo.pricePoint !== undefined && pts[dragState.resizeInfo.pricePoint]) {
                    pts[dragState.resizeInfo.pricePoint].price = newPrice;
                }
            } else if (dragState.isBodyDrag) {
                const deltaPrice = newPrice - dragState.lastPrice;
                const deltaTime = Math.round(newTime) - dragState.lastTime;
                if (deltaPrice !== 0 || deltaTime !== 0) {
                    for (const p of pts) { p.price = p.price + deltaPrice; p.time = p.time + deltaTime; }
                    dragState.lastPrice = newPrice;
                    dragState.lastTime = Math.round(newTime);
                }
                if (dragState.groupId && dragState.originalPoints && dragState.originalPoints.length > 0) {
                    for (const member of dragState.originalPoints) {
                        const memberDrawing = customDrawings.find(dd => dd.id === member.id);
                        if (memberDrawing) for (const p of memberDrawing.points) { p.price = p.price + deltaPrice; p.time = p.time + deltaTime; }
                    }
                }
            } else {
                if (pts[dragState.handleIndex]) {
                    if (!dragState.timeOnly) pts[dragState.handleIndex].price = newPrice;
                    if (!dragState.priceOnly && newTime !== null && newTime !== undefined) pts[dragState.handleIndex].time = Math.round(newTime);
                }
            }
            renderCustomDrawings();
        });
        window.addEventListener('mouseup', function () {
            if (measureState) {
                measureState = null;
                isDragging = false;
                chart.applyOptions({ handleScroll: true, handleScale: true });
                drawingMode = null;
                paneMain.style.cursor = 'crosshair';
                post({ type: 'measureFinished' });
                renderCustomDrawings();
                return;
            }
            if (freehand) {
                const pts = freehand.points;
                freehand = null;
                isDragging = false;
                chart.applyOptions({ handleScroll: true, handleScale: true });
                if (pts.length >= 2) {
                    post({
                        type: 'drawingCompleted', drawing: {
                            id: Date.now().toString(36) + Math.random().toString(36).substr(2),
                            kind: drawingMode, color: defaultColor, label: '', alert: false,
                            points: pts.map(p => ({ time: p.time, price: p.price }))
                        }
                    });
                }
                pendingPoints = [];
                renderCustomDrawings();
                return;
            }
            if (!dragState) return;
            const d = customDrawings.find(d => d.id === dragState.drawingId);
            if (d && dragState.committed) {
                if (dragState.groupId) {
                    const groupDrawings = customDrawings.filter(dd => dd.groupId === dragState.groupId);
                    post({
                        type: 'updateDrawings', drawings: groupDrawings.map(dd => ({
                            id: dd.id, points: (dd.points || []).map(p => ({ time: p.time, price: p.price })),
                            anchoredPixelX: dd.anchoredPixelX, anchoredPixelY: dd.anchoredPixelY
                        }))
                    });
                } else {
                    post({
                        type: 'updateDrawing', drawing: {
                            id: d.id, kind: d.kind, color: d.color, label: d.label || '', alert: !!d.alert,
                            points: (d.points || []).map(p => ({ time: p.time, price: p.price })),
                            anchoredPixelX: d.anchoredPixelX, anchoredPixelY: d.anchoredPixelY
                        }
                    });
                }
            }
            isDragging = false;
            chart.applyOptions({ handleScroll: true, handleScale: true });
            dragState = null;
        });
        // ---------- Measure tool (temporary drag measurement) ----------
        function drawMeasureOverlay() {
            if (!measureState || !activeSeries) return;
            const x1 = px(measureState.startTime), y1 = py(measureState.startPrice);
            const x2 = px(measureState.endTime), y2 = py(measureState.endPrice);
            if (x1 === null || y1 === null || x2 === null || y2 === null) return;
            const xL = Math.min(x1, x2), xR = Math.max(x1, x2), yT = Math.min(y1, y2), yB = Math.max(y1, y2);
            const priceDiff = measureState.endPrice - measureState.startPrice;
            const pricePct = measureState.startPrice !== 0 ? (priceDiff / measureState.startPrice) * 100 : 0;
            const barSec = rawData.length > 1 ? (rawData[1].time - rawData[0].time) : 3600;
            const barCount = Math.round(Math.abs(measureState.endTime - measureState.startTime) / barSec);
            const timeDiffSec = Math.abs(measureState.endTime - measureState.startTime);
            const timeStr = fmtDuration(timeDiffSec);
            const isUp = priceDiff >= 0;
            const boxColor = isUp ? COLORS.up : COLORS.down;
            ctx.globalAlpha = 0.15;
            ctx.fillStyle = boxColor;
            ctx.fillRect(xL, yT, Math.max(1, xR - xL), Math.max(1, yB - yT));
            ctx.globalAlpha = 1;
            ctx.strokeStyle = boxColor;
            ctx.lineWidth = 1.5;
            ctx.strokeRect(xL, yT, Math.max(1, xR - xL), Math.max(1, yB - yT));
            const labelX = xR + 10;
            const labelY = (yT + yB) / 2;
            const priceAbsStr = (priceDiff >= 0 ? '+' : '') + fmtPrice(Math.abs(priceDiff));
            const pricePctStr = (pricePct >= 0 ? '+' : '') + pricePct.toFixed(2) + '%';
            const lines = [
                priceAbsStr + ' (' + pricePctStr + ')',
                barCount + ' bars',
                timeStr
            ];
            ctx.font = '11px Trebuchet MS';
            ctx.fillStyle = boxColor;
            const lineHeight = 14;
            const startY = labelY - (lines.length - 1) * lineHeight / 2;
            for (let i = 0; i < lines.length; i++) {
                ctx.fillText(lines[i], labelX, startY + i * lineHeight);
            }
        }
        // ---------- Click / crosshair ----------
        const NEED = {
            anchoredvwap: 1, fixedrangevolumeprofile: 2, anchoredvolumeprofile: 1, pricerange: 2, daterange: 2, dateandpricerange: 2,
            longposition: 2, shortposition: 2, positionforecast: 4, barspattern: 2, ghostfeed: 1, sector: 5,
            cycliclines: 2, timecycles: 2, sineline: 2,
            elliottimpulsewave: 6, elliottcorrectionwave: 4, elliotttrianglewave: 6, elliottdoublecombowave: 4, elliotttriplecombowave: 6,
            xabcdpattern: 5, cypherpattern: 5, headandshoulders: 5, abcdpattern: 4, trianglepattern: 4, threedrivespattern: 7,
            horizontal: 1, verticalline: 1, crossline: 1,
            parallelchannel: 3, flattopbottom: 3,
            pitchfork: 3, schiffpitchfork: 3, modifiedschiffpitchfork: 3, insidepitchfork: 3,
            fibextension: 3, fibchannel: 3, fibspeedfan: 3, fibwedge: 3, trendbasedfibtime: 3,
            disjointchannel: 4,
            rectangle: 2, circle: 2, ellipse: 2, arc: 3, triangle: 3,
            polyline: 20, path: 20, rotatedrectangle: 3, curve: 3, doublecurve: 5,
            arrow: 2, arrowmarker: 1, arrowmarkup: 1, arrowmarkdown: 1, brush: 20, highlighter: 20,
            text: 1, anchoredtext: 1, note: 1, anchorednote: 1, callout: 1, comment: 1, pricelabel: 1, pricenote: 1, signpost: 1, pin: 1, flag: 1, flagmark: 1, sticker: 1, table: 1,
            measure: 2
        };
        chart.subscribeClick(function (param) {
            if (!param.point) return;
            if (isDragging) return;
            const x = param.point.x, y = param.point.y;
            if (drawingMode === 'eraser') {
                for (let i = customDrawings.length - 1; i >= 0; i--) {
                    if (!customDrawings[i].locked && hitTest(customDrawings[i], x, y)) {
                        post({ type: 'deleteDrawing', id: customDrawings[i].id });
                        return;
                    }
                }
                return;
            }
            if (drawingMode === 'brush' || drawingMode === 'highlighter') return;
            if (drawingMode === 'measure') return;
            if (!drawingMode) {
                let found = null;
                for (let i = customDrawings.length - 1; i >= 0; i--) {
                    if (!customDrawings[i].locked && hitTest(customDrawings[i], x, y)) { found = customDrawings[i]; break; }
                }
                if (!isCtrlPressed) selectedDrawingIds.clear();
                if (found) {
                    if (selectedDrawingIds.has(found.id)) selectedDrawingIds.delete(found.id);
                    else selectedDrawingIds.add(found.id);
                }
                renderCustomDrawings();
                return;
            }
            if (!param.time) return;
            const price = activeSeries.coordinateToPrice(y);
            if (price === null || price === undefined) return;
            const snappedTime = snapToBarTime(param.time);
            const snappedPrice = snapPriceToCandle(price, snappedTime);
            pendingPoints.push({ time: snappedTime, price: snappedPrice });
            const need = NEED[drawingMode] || 2;
            const isMulti = drawingMode === 'polyline' || drawingMode === 'path';
            if (!isMulti && pendingPoints.length >= need) {
                const drawing = {
                    id: Date.now().toString(36) + Math.random().toString(36).substr(2),
                    kind: drawingMode,
                    color: TEXT_TOOLS.includes(drawingMode) ? '#000000' : defaultColor,
                    label: '', alert: false,
                    points: pendingPoints.slice(0, need).map(p => ({ time: p.time, price: p.price }))
                };
                if (drawingMode === 'anchoredtext' || drawingMode === 'anchorednote') {
                    drawing.anchoredPixelX = x;
                    drawing.anchoredPixelY = y;
                }
                if (TEXT_TOOLS.includes(drawingMode)) openTextInput(x, y, drawing);
                else post({ type: 'drawingCompleted', drawing: drawing });
                pendingPoints = [];
                renderCustomDrawings();
            } else renderCustomDrawings();
        });
        chart.subscribeCrosshairMove(function (param) {
            if (!window.chrome || !window.chrome.webview) return;
            if (isDragging) return;
            if (!param || !param.time) {
                lastHoverCandle = null;
                window.chrome.webview.postMessage(JSON.stringify({ type: 'crosshair', hasData: false }));
                return;
            }
            let hovered = displayData.find(d => d.time === param.time);
            if (!hovered || hovered.open === undefined) hovered = rawData.find(d => d.time === param.time);
            if (!hovered || hovered.open === undefined) {
                lastHoverCandle = null;
                window.chrome.webview.postMessage(JSON.stringify({ type: 'crosshair', hasData: false }));
                return;
            }
            lastHoverCandle = hovered;
            const ohlcList = (displayData.length > 0 && displayData[0].open !== undefined) ? displayData : rawData;
            const idx = ohlcList.findIndex(d => d.time === hovered.time);
            const prev = idx > 0 ? ohlcList[idx - 1] : hovered;
            window.chrome.webview.postMessage(JSON.stringify({
                type: 'crosshair', hasData: true,
                open: hovered.open, high: hovered.high, low: hovered.low, close: hovered.close,
                prevOpen: prev.open, prevHigh: prev.high, prevLow: prev.low, prevClose: prev.close
            }));
        });
    </script>
