<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Meowgnal Chart Host</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #131722;
        }

        #chart {
            width: 100%;
            height: 100%;
        }
    </style>
    <script src="lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div id="chart"></div>
    <script>
        // TradingView "Dark" palette — exact values from the TV design system.
        const COLORS = {
            background: '#131722',
            grid: '#1E222D',
            border: '#2A2E39',
            textMuted: '#787B86',
            crosshair: '#758696',
            up: '#089981',
            down: '#F23645',
            accent: '#2962FF',
            volumeUp: 'rgba(8, 153, 129, 0.35)',
            volumeDown: 'rgba(242, 54, 69, 0.35)'
        };

        const chart = LightweightCharts.createChart(document.getElementById('chart'), {
            layout: {
                background: { type: LightweightCharts.ColorType.Solid, color: COLORS.background },
                textColor: COLORS.textMuted,
                fontSize: 11,
                fontFamily: "-apple-system, BlinkMacSystemFont, 'Trebuchet MS', Roboto, Ubuntu, Helvetica, Arial, sans-serif"
            },
            grid: {
                vertLines: { color: COLORS.grid },
                horzLines: { color: COLORS.grid }
            },
            rightPriceScale: {
                borderColor: COLORS.border
            },
            timeScale: {
                borderColor: COLORS.border,
                timeVisible: true,
                secondsVisible: false
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
                vertLine: { color: COLORS.crosshair, labelBackgroundColor: COLORS.border },
                horzLine: { color: COLORS.crosshair, labelBackgroundColor: COLORS.border }
            }
        });

        // Volume histogram pinned to the bottom 20% of the pane (like TV).
        const volumeSeries = chart.addHistogramSeries({
            priceFormat: { type: 'volume' },
            priceScaleId: ''
        });
        chart.priceScale('').applyOptions({
            scaleMargins: { top: 0.8, bottom: 0 }
        });

        // The raw candle dataset received from C#.
        let rawData = [];
        // The dataset currently displayed (raw, Heikin Ashi, or close-only).
        let displayData = [];
        let chartType = 'candles';
        let activeSeries = null;

        // Keeps the chart filling the whole WebView2 area when the window resizes.
        function resizeChart() {
            chart.applyOptions({
                width: document.body.clientWidth,
                height: document.body.clientHeight
            });
        }
        window.addEventListener('resize', resizeChart);
        resizeChart();

        // Creates a brand-new series object for the selected chart type.
        function createSeriesForType() {
            switch (chartType) {
                case 'line':
                    return chart.addLineSeries({ color: COLORS.accent, lineWidth: 2 });
                case 'area':
                    return chart.addAreaSeries({
                        lineColor: COLORS.accent,
                        topColor: 'rgba(41, 98, 255, 0.35)',
                        bottomColor: 'rgba(41, 98, 255, 0.03)',
                        lineWidth: 2
                    });
                case 'bars':
                    return chart.addBarSeries({ upColor: COLORS.up, downColor: COLORS.down });
                default:
                    return chart.addCandlestickSeries({
                        upColor: COLORS.up,
                        downColor: COLORS.down,
                        borderUpColor: COLORS.up,
                        borderDownColor: COLORS.down,
                        wickUpColor: COLORS.up,
                        wickDownColor: COLORS.down,
                        priceFormat: { type: 'price', precision: 2, minMove: 0.01 }
                    });
            }
        }

        // Heikin Ashi transformation of the raw candles.
        function heikinAshi(candles) {
            const ha = [];
            let prevOpen = null, prevClose = null;
            for (const c of candles) {
                const haClose = (c.open + c.high + c.low + c.close) / 4;
                const haOpen = prevOpen === null ? (c.open + c.close) / 2 : (prevOpen + prevClose) / 2;
                ha.push({
                    time: c.time,
                    open: haOpen,
                    high: Math.max(c.high, haOpen, haClose),
                    low: Math.min(c.low, haOpen, haClose),
                    close: haClose
                });
                prevOpen = haOpen;
                prevClose = haClose;
            }
            return ha;
        }

        // Builds the dataset to display for the current chart type.
        function buildDisplayData() {
            if (chartType === 'heikinashi') return heikinAshi(rawData);
            if (chartType === 'line' || chartType === 'area')
                return rawData.map(function (c) { return { time: c.time, value: c.close }; });
            return rawData; // candles and bars use raw OHLC
        }

        // Volume bars colored by candle direction (independent of chart type).
        function renderVolume() {
            volumeSeries.setData(rawData.map(function (c) {
                return {
                    time: c.time,
                    value: c.volume,
                    color: c.close >= c.open ? COLORS.volumeUp : COLORS.volumeDown
                };
            }));
        }

        // Removes the old price series and renders again with the current type.
        // (The volume series is permanent and never removed.)
        function renderWithCurrentType() {
            if (activeSeries !== null) {
                chart.removeSeries(activeSeries);
                activeSeries = null;
            }
            activeSeries = createSeriesForType();
            displayData = buildDisplayData();
            activeSeries.setData(displayData);
            renderVolume();
            chart.timeScale().fitContent();
        }

        // Initial (empty) series so the page is ready before data arrives.
        renderWithCurrentType();

        // ------------------------------------------------------------------
        // Message bridge — receives commands from C#.
        // ------------------------------------------------------------------
        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', function (e) {
                const msg = e.data;
                if (!msg || !msg.type) return;

                if (msg.type === 'setCandles') {
                    rawData = msg.data;
                    renderWithCurrentType();
                } else if (msg.type === 'updateCandle') {
                    if (activeSeries !== null) activeSeries.update(msg.data);
                    volumeSeries.update({
                        time: msg.data.time,
                        value: msg.data.volume || 0,
                        color: msg.data.close >= msg.data.open ? COLORS.volumeUp : COLORS.volumeDown
                    });
                } else if (msg.type === 'setChartType') {
                    chartType = msg.chartType;
                    renderWithCurrentType();
                }
            });
        }

        // Reports the hovered candle's OHLC (plus the previous candle's OHLC,
        // so C# can color each value against the previous candle) back to C#.
        // Works for every chart type: line/area fall back to the raw candles.
        chart.subscribeCrosshairMove(function (param) {
            if (!window.chrome || !window.chrome.webview) return;

            if (!param || !param.time) {
                window.chrome.webview.postMessage(JSON.stringify({ type: 'crosshair', hasData: false }));
                return;
            }

            let hovered = displayData.find(function (d) { return d.time === param.time; });
            if (!hovered || hovered.open === undefined) {
                hovered = rawData.find(function (d) { return d.time === param.time; });
            }
            if (!hovered || hovered.open === undefined) {
                window.chrome.webview.postMessage(JSON.stringify({ type: 'crosshair', hasData: false }));
                return;
            }

            // Previous candle for coloring: from the same OHLC-bearing list.
            const ohlcList = (displayData.length > 0 && displayData[0].open !== undefined) ? displayData : rawData;
            const idx = ohlcList.findIndex(function (d) { return d.time === hovered.time; });
            const prev = idx > 0 ? ohlcList[idx - 1] : hovered;

            window.chrome.webview.postMessage(JSON.stringify({
                type: 'crosshair',
                hasData: true,
                open: hovered.open, high: hovered.high, low: hovered.low, close: hovered.close,
                prevOpen: prev.open, prevHigh: prev.high, prevLow: prev.low, prevClose: prev.close
            }));
        });
    </script>
</body>
</html>
