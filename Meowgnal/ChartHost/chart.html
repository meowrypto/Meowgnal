<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Meowgnal Chart Host</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0B0D12;
        }

        #chart {
            width: 100%;
            height: 100%;
        }
    </style>
    <script src="lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div id="chart"></div>
    <script>
        // Colors matched to the Meowgnal WPF dark theme.
        const COLORS = {
            background: '#0B0D12',
            text: '#8A8F9C',
            grid: '#1A1E28',
            border: '#262B38',
            up: '#26A69A',
            down: '#EF5350'
        };

        const chart = LightweightCharts.createChart(document.getElementById('chart'), {
            layout: {
                background: { type: LightweightCharts.ColorType.Solid, color: COLORS.background },
                textColor: COLORS.text
            },
            grid: {
                vertLines: { color: COLORS.grid },
                horzLines: { color: COLORS.grid }
            },
            rightPriceScale: {
                borderColor: COLORS.border
            },
            timeScale: {
                borderColor: COLORS.border,
                timeVisible: true,
                secondsVisible: false
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal
            }
        });

        const candleSeries = chart.addCandlestickSeries({
            upColor: COLORS.up,
            downColor: COLORS.down,
            borderUpColor: COLORS.up,
            borderDownColor: COLORS.down,
            wickUpColor: COLORS.up,
            wickDownColor: COLORS.down,
            priceFormat: {
                type: 'price',
                precision: 2,
                minMove: 0.01
            }
        });

        // The latest dataset received from C#, kept so the crosshair handler
        // can look up the hovered candle and its predecessor.
        let currentData = [];

        // Keeps the chart filling the whole WebView2 area when the window resizes.
        function resizeChart() {
            chart.applyOptions({
                width: document.body.clientWidth,
                height: document.body.clientHeight
            });
        }
        window.addEventListener('resize', resizeChart);
        resizeChart();

        // ------------------------------------------------------------------
        // Message bridge — receives commands from C#.
        // C# calls CoreWebView2.PostWebMessageAsJson(...); the message
        // arrives here already parsed as a JavaScript object.
        // ------------------------------------------------------------------
        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', function (e) {
                const msg = e.data;
                if (!msg || !msg.type) return;

                if (msg.type === 'setCandles') {
                    currentData = msg.data;
                    candleSeries.setData(currentData);
                    chart.timeScale().fitContent();
                } else if (msg.type === 'updateCandle') {
                    candleSeries.update(msg.data);
                }
            });
        }

        // Reports the hovered candle's OHLC (plus the previous candle's OHLC,
        // so C# can color each value against the previous candle) back to C#.
        chart.subscribeCrosshairMove(function (param) {
            if (!window.chrome || !window.chrome.webview) return;

            if (!param || !param.time) {
                window.chrome.webview.postMessage(JSON.stringify({ type: 'crosshair', hasData: false }));
                return;
            }

            const index = currentData.findIndex(function (d) { return d.time === param.time; });
            if (index < 0) {
                window.chrome.webview.postMessage(JSON.stringify({ type: 'crosshair', hasData: false }));
                return;
            }

            const d = currentData[index];
            const p = index > 0 ? currentData[index - 1] : d;
            window.chrome.webview.postMessage(JSON.stringify({
                type: 'crosshair',
                hasData: true,
                open: d.open, high: d.high, low: d.low, close: d.close,
                prevOpen: p.open, prevHigh: p.high, prevLow: p.low, prevClose: p.close
            }));
        });
    </script>
</body>
</html>
